#
# One rung of the capacity sweep, measured at three tiers.
#
# Every probe runs outside the load window. That is deliberate: the obvious
# design samples the events table during the window, but `events` carries no
# index on eventsource, so each sample is a sequential scan over the whole table
# and competes for exactly the disk I/O the benchmark is trying to saturate
# (#216). Everything is instead reconstructed afterwards from range scans over
# events_time_idx, which cost time proportional to the window rather than to the
# table. The measurement window therefore carries load and nothing else.

- name: "Read the Minion UDP counters before {{ ftc_rate }}"
  ansible.builtin.shell:
    cmd: |
      set -eu
      awk '/^Udp:/ { if (h == "") { for (i=2;i<=NF;i++) k[i]=$i; h="x"; next }
                     for (i=2;i<=NF;i++) v[k[i]]=$i }
           END { print (v["InErrors"] + v["RcvbufErrors"]) }' /proc/net/snmp
  delegate_to: "{{ minion }}"
  register: ftc_udp_before
  changed_when: false
  failed_when: ftc_udp_before.stdout is not match('^[0-9]+$')

# Should be at or near zero before a rung. A non-zero starting lag means the
# previous rung never drained, so this rung starts against a backlog and its
# result belongs to both rungs rather than to either.
- name: "Read the sink lag before {{ ftc_rate }}"
  ansible.builtin.command:
    cmd: kafka-offsets {{ sink_topic }} --require-topic --lag={{ ftc_sink_group }}
  register: ftc_lag_before
  changed_when: false
  failed_when: ftc_lag_before.stdout is not match('^[0-9]+$')

- name: "Mark the measurement start for {{ ftc_rate }}"
  ansible.builtin.command:
    cmd: >-
      sudo -u postgres psql -qtA -d {{ endpoints.measurement.database.name }}
      -c "select extract(epoch from now())"
  delegate_to: "{{ db }}"
  become: true
  register: ftc_t0
  changed_when: false

- name: "Drive the load at {{ ftc_rate }}"
  ansible.builtin.command:
    cmd: >-
      nl6-loadtest --protocol snmp-trap --rate {{ ftc_rate }} --window {{ ftc_window }}
      --start-ip {{ ftc_start_ip }} --count {{ ftc_device_count }}
      --label "fm-snmptrap-capacity {{ ftc_rate }}/device"
      --html /tmp/ftc-{{ ftc_rung_label | default(ftc_rate) }}.html
      --json /tmp/ftc-{{ ftc_rung_label | default(ftc_rate) }}.json
  register: ftc_load
  changed_when: true
  # rc 1 means the generator did not deliver the full requested load; rc > 1 is
  # a real error. Neither is decided here — the amount of the shortfall is what
  # matters, and that is only knowable from the ledger, which is read below.
  # Gating on rc alone fails a rung that missed 10 sends out of 3000.
  failed_when: ftc_load.rc > 1

# When load stopped, which is not where the counting bracket closes: the bracket
# runs past the drain so events still in flight are counted. Kept as the marker
# for anything that must describe the offered period rather than the whole
# bracket.
- name: "Mark the end of load for {{ ftc_rate }}"
  ansible.builtin.command:
    cmd: >-
      sudo -u postgres psql -qtA -d {{ endpoints.measurement.database.name }}
      -c "select extract(epoch from now())"
  delegate_to: "{{ db }}"
  become: true
  register: ftc_t_load_end
  changed_when: false

# Drain on the lag returning to where it started, not on a fixed pause. The
# simulated fleet emits continuously, so "wait until the count stops moving"
# never fires; a fixed pause either truncates a slow drain (under-reporting the
# rung) or wastes wall clock on every fast one. The tolerance is absolute
# because a baseline of zero admits no relative one.
- name: "Drain the pipeline after {{ ftc_rate }}"
  ansible.builtin.command:
    cmd: kafka-offsets {{ sink_topic }} --lag={{ ftc_sink_group }}
  register: ftc_drain
  until: >-
    ftc_drain.stdout is match('^[0-9]+$')
    and (ftc_drain.stdout | int) <= (ftc_lag_before.stdout | int) + (ftc_drain_tolerance | int)
  retries: "{{ (ftc_drain_timeout | int // ftc_drain_poll | int) | int }}"
  delay: "{{ ftc_drain_poll }}"
  changed_when: false
  # Not fatal. A rung that never drains is the finding — it says the deployment
  # cannot keep up at this rate — and failing here would discard the tier
  # readings that prove it.
  failed_when: false

# The events for traps sent late in the window arrive during the drain, so the
# counting bracket has to close after the drain rather than at the end of load.
# Lag drained is necessary and not sufficient, so the bracket does not close
# until the events themselves stop arriving.
#
# Tier 2 reads lag in Kafka messages and the sink batches at a rate-dependent
# size (#215), so a lag inside the tolerance can still hide a six-figure backlog
# of traps. Closing the bracket there leaves the rung's own events to be written
# afterwards, where they land inside the NEXT rung's window: measured at the
# reference-to-first-rung boundary, where both rungs offer the same load, the
# second counted 299,716 events for 149,900 sent — a ratio of 1.999, one rung's
# worth of spillover. At higher rates the same spillover is small against the
# rung's own volume and reads as a healthy 1.000, which is worse: it is present
# and invisible.
#
# Quiescence is defined against the background rather than as zero, because the
# fleet keeps emitting: the fleet's own traps continue at ftc_background_mps
# whatever the sweep does, so "stopped" can only mean "back down to what an idle
# fleet produces".
- name: "Wait for the events to stop arriving at {{ ftc_rate }}"
  ansible.builtin.shell:
    cmd: |
      set -eu
      q="select count(*) from events
          where eventtime >= to_timestamp({{ ftc_t0.stdout | trim }})
            and eventsource = 'trapd'"
      a=$(sudo -u postgres psql -qtA -d {{ endpoints.measurement.database.name }} -c "$q")
      sleep {{ ftc_quiesce_poll }}
      b=$(sudo -u postgres psql -qtA -d {{ endpoints.measurement.database.name }} -c "$q")
      echo $(( b - a ))
  delegate_to: "{{ db }}"
  become: true
  register: ftc_quiesce
  # Twice what an idle fleet would produce over the same poll, so ordinary
  # background traffic satisfies it and a real backlog does not.
  until: >-
    ftc_quiesce.stdout is match('^[0-9]+$')
    and (ftc_quiesce.stdout | int)
        <= (2 * (ftc_background_mps | int) * (ftc_quiesce_poll | int) / 1000) | round | int
  retries: "{{ (ftc_quiesce_timeout | int // ftc_quiesce_poll | int) | int }}"
  delay: 0
  changed_when: false
  # A rung that never settles is the finding, not a reason to discard the tier
  # readings that show why.
  failed_when: false

- name: "Mark the measurement end for {{ ftc_rate }}"
  ansible.builtin.command:
    cmd: >-
      sudo -u postgres psql -qtA -d {{ endpoints.measurement.database.name }}
      -c "select extract(epoch from now())"
  delegate_to: "{{ db }}"
  become: true
  register: ftc_t1
  changed_when: false

- name: "Read the sink lag after {{ ftc_rate }}"
  ansible.builtin.command:
    cmd: kafka-offsets {{ sink_topic }} --lag={{ ftc_sink_group }}
  register: ftc_lag_after
  changed_when: false
  failed_when: ftc_lag_after.stdout is not match('^[0-9]+$')

- name: "Read the Minion UDP counters after {{ ftc_rate }}"
  ansible.builtin.shell:
    cmd: |
      set -eu
      awk '/^Udp:/ { if (h == "") { for (i=2;i<=NF;i++) k[i]=$i; h="x"; next }
                     for (i=2;i<=NF;i++) v[k[i]]=$i }
           END { print (v["InErrors"] + v["RcvbufErrors"]) }' /proc/net/snmp
  delegate_to: "{{ minion }}"
  register: ftc_udp_after
  changed_when: false
  failed_when: ftc_udp_after.stdout is not match('^[0-9]+$')

# Counted by eventtime, rated by eventcreatetime, and the difference between
# those two is the whole measurement.
#
# eventtime is the trap's own timestamp, so bucketing on it replays the rate the
# generator OFFERED no matter how far behind the deployment is: a 60s burst of
# 1.5M traps lands in one eventtime minute even when it took five minutes to
# write. eventcreatetime is when OpenNMS created the row, so its span is the
# rate the deployment actually SUSTAINED.
#
# Measured on this lab at 25,000/s offered: 24,783/s by eventtime, ~4,600/s by
# eventcreatetime, with traps sitting up to 415s behind. Core's own trapd metric
# independently reported a p99 of 4,687/s, which is the eventcreatetime figure
# and not the eventtime one.
#
# Completeness alone therefore cannot bound capacity here. Kafka's sink absorbs
# whatever the Minion accepts and the Core drains it later, so "nothing was
# eventually lost" stays true at any offered rate the generator can reach — it
# measures the buffer, not the system.
- name: "Read what persisted for {{ ftc_rate }}"
  ansible.builtin.shell:
    cmd: |
      set -eu
      sudo -u postgres psql -qtA -d {{ endpoints.measurement.database.name }} \
        -c "select count(*) from events
             where eventtime >= to_timestamp({{ ftc_t0.stdout | trim }})
               and eventtime <  to_timestamp({{ ftc_t1.stdout | trim }})
               and eventsource = 'trapd'" \
        -c "select count(*) from events
             where eventcreatetime >= to_timestamp({{ ftc_t0.stdout | trim }})
               and eventcreatetime <  to_timestamp({{ ftc_t_load_end.stdout | trim }})
               and eventsource = 'trapd'" \
        -c "select coalesce(round(percentile_cont(0.99) within group
                     (order by extract(epoch from (eventcreatetime - eventtime)))::numeric)::text, '0')
             from events
            where eventtime >= to_timestamp({{ ftc_t0.stdout | trim }})
              and eventtime <  to_timestamp({{ ftc_t1.stdout | trim }})
              and eventsource = 'trapd'"
  delegate_to: "{{ db }}"
  become: true
  register: ftc_persisted
  changed_when: false

- name: "Read the sent-ledger for {{ ftc_rate }}"
  ansible.builtin.slurp:
    src: "/tmp/ftc-{{ ftc_rung_label | default(ftc_rate) }}.json"
  register: ftc_ledger
  failed_when: false

# The allowance is one tick per device, and it is not slack. nl6 computes
# expected as rate x devices x window, but a device ticking every 1/rate over a
# half-open window fits one interval fewer, so a healthy run comes in exactly
# device_count short: 149,900 of 150,000 at 100 devices, 59,990 of 60,000 at 10.
# Rate-independent, which is what proves it is arithmetic rather than loss —
# real loss scales with rate.
#
# Absolute, because the artifact is absolute while the floor is a fraction, so
# its weight grows as rate x window shrinks: 0.02% at 5/device over 15m, but
# 1.67% at 1/device over 60s, which would condemn a rung over an off-by-one.
- name: "Judge whether the generator filled the request at {{ ftc_rate }}"
  ansible.builtin.set_fact:
    ftc_delivered_ok: >-
      {{ (ledger.delivered.expected | default(0) | int) == 0
         or (ledger.delivered.sent | default(0) | int)
            >= (ledger.delivered.expected | int) * (ftc_min_delivery | float)
         or ((ledger.delivered.expected | int) - (ledger.delivered.sent | default(0) | int))
            <= (ftc_device_count | int) }}
  vars:
    ledger: >-
      {{ (ftc_ledger.content | default("") | b64decode | from_json)
         if ftc_ledger.content is defined else {"delivered": {}, "request": {}} }}

# The validity gate, and it is about the generator rather than the SUT.
#
# fm-snmptrap tolerates a shortfall and records the rung, because a short
# delivery is still a valid fidelity data point. A capacity sweep cannot: a rung
# the generator could not fill measures the generator, and recording it as R_max
# would publish nl6's ceiling as the deployment's.
#
# Gated on the fraction, not on the exit status. nl6 exits 1 for any shortfall
# at all, including the ~0.3% jitter a healthy run shows, so an rc test rejects
# every rung and the sweep cannot run.
# A rung the generator could not fill measures nl6, not the deployment, so it
# cannot be a capacity measurement. It is recorded as INVALID and the sweep goes
# on, rather than aborting.
#
# Aborting was worse than useless: it discarded the whole table, including every
# rung that had already measured cleanly, and it fired mid-drain, so the events
# still in flight for that rung never landed and the run's totals could not be
# reconciled afterwards either. Same failure as gating the generator on rc — a
# fact about the generator taking down facts about the deployment.
- name: "Warn when the generator could not fill the request at {{ ftc_rate }}"
  ansible.builtin.debug:
    msg: >-
      GENERATOR-LIMITED at {{ ftc_rate }}/device: delivered
      {{ ledger.delivered.sent | default(0) }} of
      {{ ledger.delivered.expected | default(0) }} requested
      ({{ ((ledger.delivered.sent | default(0) | int)
           / ([ledger.delivered.expected | default(1) | int, 1] | max) * 100) | round(1) }}%,
      floor {{ (ftc_min_delivery | float * 100) | round(1) }}%). nl6 is out of
      headroom here, so this rung says nothing about the deployment. Spread the
      same fleet-wide rate over more devices, or add generator capacity.
  when: not (ftc_delivered_ok | bool)
  vars:
    ledger: >-
      {{ (ftc_ledger.content | default("") | b64decode | from_json)
         if ftc_ledger.content is defined else {"delivered": {}, "request": {}} }}

- name: "Record the rung for {{ ftc_rate }}"
  ansible.builtin.set_fact:
    ftc_results: "{{ (ftc_results | default([])) + [rung] }}"
    ftc_rows: >-
      {{ (ftc_rows | default([]))
         + ['%-9s %-8s %-8s %-8s %-8s %-6s %-6.3f %-8s  %s' | format(
              ftc_rung_label | default(ftc_rate),
              (ftc_rate | int) * (ftc_device_count | int),
              rung.sent, rung.events, rung.achieved, rung.lag_p99,
              rung.ratio | float, rung.udp_drops, rung.verdict) ] }}
  vars:
    ledger: >-
      {{ (ftc_ledger.content | default("") | b64decode | from_json)
         if ftc_ledger.content is defined else {"delivered": {}, "request": {}} }}
    bracket_s: "{{ (ftc_t1.stdout | trim | float) - (ftc_t0.stdout | trim | float) }}"
    persisted_raw: "{{ ftc_persisted.stdout_lines[0] | default(0) | int }}"
    # The rate the deployment sustained *while load was being offered*: rows
    # created inside the load window, over the length of that window.
    #
    # Not the span of eventcreatetime across the whole bracket. The fleet emits
    # continuously, so its background traps keep creating rows until the bracket
    # closes and push that span out to the bracket's length whatever the rung
    # did — measured at 2,000/s offered, an 80s span for a 60s window, reporting
    # 1,504/s for a rung whose p99 wait was one second and which was plainly
    # keeping up.
    #
    # A deployment that keeps up writes the traps as they arrive, so everything
    # lands inside the window and this equals the offered rate. One that falls
    # behind leaves the remainder for the drain, and the shortfall here is the
    # size of the deficit.
    created_in_window: "{{ ftc_persisted.stdout_lines[1] | default(0) | int }}"
    # Divided by the generator's own window, not by the task's wall clock.
    #
    # t_load_end is stamped after the load command returns, so it carries nl6's
    # two-second drain plus process start and the SSH round trip. Derived from
    # the results, that is 63.7s for a 60s window, and it was identical on every
    # rung that kept up — a constant ~6% dilution of the reported rate, sitting
    # in a column next to the offered rate it is meant to be compared against.
    # It read as a 6% deficit when every trap had in fact arrived.
    #
    # The window is the interval the generator actually offered load over, so
    # dividing by it makes achieved directly comparable to offer/s. Guarded at
    # the division because a lint render has no registers and the ledger is empty.
    window_seconds: >-
      {{ ledger.request.window_seconds | default(0) | float }}
    achieved: >-
      {{ ((created_in_window | int) / ([window_seconds | float, 1] | max)) | round | int }}
    # How far behind the pipeline ran. Bounded means it kept up; growing into
    # minutes means Kafka is holding a backlog the Core has not reached yet.
    lag_p99: "{{ ftc_persisted.stdout_lines[2] | default(0) | int }}"
    offered: "{{ (ftc_rate | int) * (ftc_device_count | int) }}"
    background: "{{ ((ftc_background_mps | int * (bracket_s | float)) / 1000) | round | int }}"
    persisted: "{{ [(persisted_raw | int) - (background | int), 0] | max }}"
    ratio_v: >-
      {{ (persisted | int) / ([ledger.delivered.sent | default(0) | int, 1] | max) }}
    # vs-ref is undefined on the reference rung itself, which is measured before
    # the ratio it defines exists. Treated as passing so the reference is not
    # reported as a failure of the thing it calibrates.
    tier3_fidelity: >-
      {{ true if ftc_reference_ratio is not defined
         else (ratio_v | float) / (ftc_reference_ratio | float) >= (ftc_fidelity_floor | float) }}
    # Did the deployment keep up in real time, or merely catch up later?
    #
    # This is the capacity question, and completeness cannot answer it: Kafka's
    # sink absorbs whatever the Minion accepts, so everything is eventually
    # persisted at any rate the generator can reach. The rate that matters is
    # the one eventcreatetime spans, and it must track what was offered.
    # Against what the generator sent, not against a nominal rate. Both sides
    # then describe the same traps and share no denominator: comparing a count
    # taken over wall-clock against rate x devices mismatched them by the
    # generator's own drain and the task overhead, a steady ~6% that read as a
    # failure on rungs whose p99 wait was one second.
    tier3_keptup: >-
      {{ (created_in_window | int)
         >= ([ledger.delivered.sent | default(0) | int, 1] | max) * (ftc_keepup_floor | float) }}
    rung:
      rate: "{{ ftc_rate }}"
      devices: "{{ ftc_device_count }}"
      fleet_rate: "{{ (ftc_rate | int) * (ftc_device_count | int) }}"
      sent: "{{ ledger.delivered.sent | default(0) }}"
      expected: "{{ ledger.delivered.expected | default(0) }}"
      send_failures: "{{ ledger.delivered.send_failures | default(0) }}"
      events_raw: "{{ persisted_raw }}"
      background: "{{ background }}"
      events: "{{ persisted }}"
      bracket_s: "{{ bracket_s | float | round(1) }}"
      ratio: "{{ ratio_v }}"
      udp_drops: "{{ (ftc_udp_after.stdout | trim | int) - (ftc_udp_before.stdout | trim | int) }}"
      lag_before: "{{ ftc_lag_before.stdout | trim | int }}"
      lag_after: "{{ ftc_lag_after.stdout | trim | int }}"
      # Tier 1: nothing dropped at the Minion's socket.
      tier1: "{{ ((ftc_udp_after.stdout | trim | int) - (ftc_udp_before.stdout | trim | int)) == 0 }}"
      # Tier 2: the backlog drained back to where it started.
      tier2: >-
        {{ (ftc_lag_after.stdout | trim | int)
           <= (ftc_lag_before.stdout | trim | int) + (ftc_drain_tolerance | int) }}
      # Tier 3: fidelity held and did not decay across the window.
      created_in_window: "{{ created_in_window }}"
      window_seconds: "{{ window_seconds }}"
      achieved: "{{ achieved }}"
      lag_p99: "{{ lag_p99 }}"
      tier3: "{{ (tier3_fidelity | bool) and (tier3_keptup | bool) }}"
      delivered_ok: "{{ ftc_delivered_ok | bool }}"
      # INVALID outranks the tiers. A rung the generator could not fill offered
      # less load than it claims, so its tiers would pass for a reason that has
      # nothing to do with the deployment — and reading that as R_max would
      # publish nl6's ceiling as OpenNMS's.
      verdict: >-
        {{ 'INVALID'
           if not (ftc_delivered_ok | bool)
           else 'PASS'
           if (((ftc_udp_after.stdout | trim | int) - (ftc_udp_before.stdout | trim | int)) == 0)
              and ((ftc_lag_after.stdout | trim | int)
                   <= (ftc_lag_before.stdout | trim | int) + (ftc_drain_tolerance | int))
              and (tier3_fidelity | bool) and (tier3_keptup | bool)
           else 'FAIL' }}
