#
# Phase A defaults: short windows, coarse ladder, bracketing only. Phase B and C
# override ftc_rates and ftc_window through EXTRA_VARS — see README.md.
#
# make passes this file via --extra-vars, and EXTRA_VARS is passed after it, so
# a CLI override of any name defined here wins. That ordering is what makes the
# phases runnable without editing this file.

# ── the fleet (a pinned control, not a variable of this experiment) ───────────
# rate is per device, so the fleet-wide offered rate is rate x count. The claim
# is scoped to this fleet shape: 2500/s from 10 sources is not necessarily the
# same workload as 2500/s from 500, because trapd may key work by source.
ftc_start_ip: "10.42.0.1"
# 100, not 10. The offered rate is per device, so ten devices asked for a
# fleet-wide 10,000/s means 1,000 traps/s out of each simulated agent, and nl6
# ran out of headroom there: it delivered 563,490 of 600,000 (93.9%) and the
# delivery gate correctly refused to call that a property of the deployment.
# Spreading the same fleet-wide rate over 100 devices asks each for a tenth as
# much, and is the more realistic shape besides.
ftc_device_count: 100
ftc_foreign_source: nl6-ft
# Empty means the fleet emits no syslog at all: nl6 omits the block and the
# devices come back with "syslog": null.
#
# One variable at a time. A trap benchmark run with the fleet's syslog left on
# is measuring the two paths together — syslog every 10s per device travels the
# same Minion sink, Kafka topic, eventd queue and Postgres inserts as the traps,
# so it consumes the capacity under test and depresses R_max. Set this to a
# host:port only if the question is explicitly about mixed load.
ftc_syslog_collector: ""

# ── the sweep ─────────────────────────────────────────────────────────────────
# Ascending, and the first entry is the reference. Phase A brackets; it makes no
# claims, because 60s is absorbed by the sink batch and the eventd queue.
#
# Per device, so against ftc_device_count: 100 this ladder is a fleet-wide
# 2,500 / 5,000 / 10,000 / 20,000 / 40,000 per second. The deployment already
# carried 5,000/s cleanly at the narrower fleet shape, so the reference starts
# above that and the ladder reaches for where it gives way.
ftc_rates: [25, 50, 100, 200, 400]
ftc_window: 60s

# ── the daemon set, pinned so the trap path is the only path ─────────────────
# Written into opennms.conf and applied by a restart. Both default to true in
# the shipped service-configuration.xml, so both are in the path unless pinned.
ftc_core_services:
  # Correctness. Alarmd performs auto-clean, which DELETES the older events
  # backing an alarm once a new one reduces onto it. SNMP_Authen_Failure
  # reduces on %uei%:%dpname%:%nodeid%, so a whole run's authenticationFailure
  # traps collapse onto one alarm per node and the rows the sweep counts are
  # removed underneath it. Measured on this lab: ten alarms carrying a summed
  # counter of 61,672, against an events table holding a few hundred survivors.
  #
  # Worse than a fixed loss, the deletion is asynchronous, so the surviving
  # count depends on when the bracket closes: the same 2,990-trap run showed
  # 1,099 survivors moments after it finished and settled towards ~50% later.
  # A reference ratio cannot normalise that away, because the correction moves
  # with load — which is the independent variable.
  CORE_SERVICE_ALARMD_ENABLED: "false"
  # Isolation. The translator is not what deletes rows, but it is per-event work
  # on the hot path that has nothing to do with trap ingestion. Pinning it off
  # keeps the measurement to trapd -> eventd -> database, and leaves "with event
  # translation" as its own experiment against the same harness.
  CORE_SERVICE_EVENTTRANSLATOR_ENABLED: "false"

# ── pass criteria ─────────────────────────────────────────────────────────────
# Fidelity relative to the measured reference rather than to an assumed 1.0.
# With auto-clean off the reference should land near 1.0; it is still measured
# rather than assumed, because that is what catches the next thing that eats
# rows silently.
ftc_fidelity_floor: 0.99
# The rate the deployment sustained, measured across the span of
# eventcreatetime, must be at least this share of the rate offered.
#
# This is the capacity criterion, and completeness cannot substitute for it.
# Kafka's sink absorbs whatever the Minion accepts and the Core drains it later,
# so "nothing was eventually lost" stays true at any rate the generator can
# reach — it measures the buffer, not the deployment. Measured here at 25,000/s
# offered: everything persisted, but at ~4,600/s with traps sitting up to 415s
# behind, which Core's own trapd metric independently reported as a p99 of
# 4,687/s.
ftc_keepup_floor: 0.95

# ── drain ─────────────────────────────────────────────────────────────────────
# Absolute, since a baseline of zero admits no relative tolerance. One batch of
# slack: the consumer commits per batch, so a lag of a few records is a commit
# in flight rather than a backlog.
ftc_drain_tolerance: 100
ftc_drain_poll: 10
ftc_drain_timeout: 600

# Event quiescence, which is what actually closes the bracket. Lag drained is
# necessary and not sufficient: lag counts Kafka messages and the sink batches,
# so a lag inside the tolerance can hide a six-figure backlog of traps that then
# lands in the next rung's window.
ftc_quiesce_poll: 15
ftc_quiesce_timeout: 900

# ── settling and baselines ────────────────────────────────────────────────────
# Long enough that the count is not dominated by rounding, short enough not to
# add a rung to the sweep.
ftc_baseline_seconds: 30
# The import raises Provisiond, nodeUp and poller events. Measuring the idle
# background rate during that storm measures the storm.
ftc_provision_settle_seconds: 300
# Every rung must be filled by the generator to at least this fraction, or it
# measures nl6's ceiling rather than the deployment's. 0.99 rather than 1.0
# because a healthy 60s run at 5/device shows ~0.3% jitter (2,990 of 3,000):
# demanding an exact fill rejects every rung and the sweep cannot run.
ftc_min_delivery: 0.99
# The reference is held to the same floor via the rung gate; this remains the
# separate, looser check that its *signal* is usable.
ftc_reference_min_delivery: 0.9

# ── where the accepted side is read ───────────────────────────────────────────
# The Core's sink consumer group. Not derived from the manifest because the
# manifest publishes topics, not groups.
ftc_sink_group: OpenNMS
