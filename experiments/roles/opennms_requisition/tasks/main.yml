- name: Create the tool directory
  ansible.builtin.file:
    path: "{{ opennms_requisition_home }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ["requisition"]

- name: Install nl6's provisioning script
  ansible.builtin.copy:
    src: onms-provision.sh
    dest: "{{ opennms_requisition_home }}/onms-provision.sh"
    owner: root
    group: root
    mode: "0755"
  tags: ["requisition"]

# Before the import, so the first scan already runs under it. Re-posting the
# same definition on every rung is idempotent: OpenNMS replaces it in place.
- name: Define the foreign source (ICMP+SNMP detectors, collect all up interfaces)
  ansible.builtin.uri:
    url: "{{ opennms_requisition_base }}/rest/foreignSources"
    method: POST
    user: "{{ opennms_requisition_user }}"
    password: "{{ opennms_requisition_password }}"
    force_basic_auth: true
    headers:
      Content-Type: application/xml
    body: "{{ lookup('template', 'foreign-source.xml.j2') }}"
    status_code: [200, 201, 202, 204]
  changed_when: true
  tags: ["requisition"]

# Every endpoint comes from the manifest. Nodes are pinned to the Minion's
# location because the simulated network is reachable from the Minion and
# nowhere else: a node polled from the Core would simply never answer.
- name: Generate and import the requisition
  ansible.builtin.command:
    cmd: "{{ opennms_requisition_home }}/onms-provision.sh --import"
  environment:
    NL6_URL: "{{ opennms_requisition_endpoints.generators.nl6.url }}"
    OPENNMS_BASE_URL: >-
      http://{{ opennms_requisition_endpoints.measurement.opennms.host }}:{{ opennms_requisition_endpoints.measurement.opennms.port }}/opennms
    OPENNMS_USER: "{{ opennms_requisition_user }}"
    OPENNMS_PASS: "{{ opennms_requisition_password }}"
    FOREIGN_SOURCE: "{{ opennms_requisition_foreign_source }}"
    MINION_LOCATION: "{{ opennms_requisition_location }}"
  register: opennms_requisition_import
  changed_when: true
  tags: ["requisition"]

- name: Count the fleet nl6 holds
  ansible.builtin.uri:
    url: "{{ opennms_requisition_endpoints.generators.nl6.url }}/api/v1/devices"
    method: GET
    return_content: true
  register: opennms_requisition_fleet
  changed_when: false
  tags: ["requisition"]

# Without this the wait below cannot fail: an empty fleet makes its target 0,
# and "totalCount >= 0" is true on the first poll for any value, including zero
# nodes. The rung would then settle a full interval and measure an empty system.
- name: Assert nl6 holds a fleet to provision
  ansible.builtin.assert:
    that:
      - (opennms_requisition_fleet.json.data | default([], true) | length) > 0
    fail_msg: >-
      nl6 reports no devices, so there is nothing to provision and the wait
      below would pass immediately against zero nodes. Create the fleet before
      calling this role.
    quiet: true
  tags: ["requisition"]

- name: Wait for provisiond to finish importing
  ansible.builtin.uri:
    url: >-
      {{ opennms_requisition_base }}/rest/nodes?foreignSource={{ opennms_requisition_foreign_source }}&limit=1
    method: GET
    user: "{{ opennms_requisition_user }}"
    password: "{{ opennms_requisition_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
    return_content: true
  register: opennms_requisition_nodes
  # Exact, not >=. A stale foreign source holding more nodes than this fleet
  # would otherwise satisfy the wait immediately and every rung would measure
  # the previous run's lab.
  until: >-
    (opennms_requisition_nodes.json.totalCount | default(0) | int)
    == (opennms_requisition_fleet.json.data | default([], true) | length)
  retries: "{{ (opennms_requisition_timeout | int // (opennms_requisition_poll_interval | int)) | int }}"
  delay: "{{ opennms_requisition_poll_interval }}"
  changed_when: false
  tags: ["requisition"]

# The import wait above proves the nodes exist; it says nothing about the
# async node scans that follow. A scan that runs while the sim network is
# unreachable persists zero SNMP interfaces and, at the default 1d
# scan-interval, stays that way for 24 hours — the sweep then measures an
# empty system and reports it as a slow one. Polling the newest node — the
# one whose scan is still in flight — until it holds SNMP interfaces converts
# that silent zero into either a healed wait or a loud failure naming the
# actual problem.
- name: Find the newest node in the foreign source
  ansible.builtin.uri:
    url: >-
      {{ opennms_requisition_base }}/rest/nodes?foreignSource={{
        opennms_requisition_foreign_source }}&limit=1&orderBy=id&order=desc
    method: GET
    user: "{{ opennms_requisition_user }}"
    password: "{{ opennms_requisition_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
    return_content: true
  register: opennms_requisition_newest
  changed_when: false
  tags: ["requisition"]

- name: Wait for the node scan to persist SNMP interfaces
  ansible.builtin.uri:
    url: >-
      {{ opennms_requisition_base }}/rest/nodes/{{
        (opennms_requisition_newest.json.node | first).id
      }}/snmpinterfaces?limit=1
    method: GET
    user: "{{ opennms_requisition_user }}"
    password: "{{ opennms_requisition_password }}"
    force_basic_auth: true
    headers:
      Accept: application/json
    return_content: true
  register: opennms_requisition_snmpifs
  until: (opennms_requisition_snmpifs.json.totalCount | default(0) | int) > 0
  retries: "{{ (opennms_requisition_scan_timeout | int // (opennms_requisition_poll_interval | int)) | int }}"
  delay: "{{ opennms_requisition_poll_interval }}"
  changed_when: false
  tags: ["requisition"]

- name: Report the requisition
  ansible.builtin.debug:
    msg: >-
      {{ opennms_requisition_nodes.json.totalCount }} node(s) in foreign-source
      {{ opennms_requisition_foreign_source }} at location
      {{ opennms_requisition_location }}
  tags: ["requisition"]
