---
opennms_distribution: Horizon
# The OpenNMS apt repository retains only the current point release per major —
# superseded versions are removed, so a stale pin fails with
# "no available installation candidate". Keep this in sync with what
# debian.opennms.org actually serves.
#
# The collection derives the repository dist from this value's major
# (opennms-36), so a major bump here moves the dist with it. It configures that
# dist instead of the "stable" alias, which floats: it has pointed at
# opennms-34, -35 and -36 in turn, so an `apt upgrade` could once have offered a
# major version jump.
#
# Fresh deploys only. `apt_repository` runs with state: present and never
# removes the "stable" entry an older run wrote, so re-deploying onto a host
# provisioned before this bump leaves both dists configured. Equivalent today,
# because "stable" still resolves to opennms-36.
#
# It stops being equivalent once "stable" follows opennms-37: the host then has a
# floating major-version source enabled again, and the collection's exact-patch
# pin will already have stopped matching anything by then (the repository serves
# only the current point release). What still holds the line is the dpkg hold in
# bootstrap/roles/apt_update, which is why every OpenNMS package the collection
# pins is listed there. Drop the stale file from /etc/apt/sources.list.d/ on any
# host provisioned before this bump.
opennms_version: "36.0.3"
opennms_pkg_version: "{{ opennms_version }}*"

# Fail the deploy on an unsynchronised clock. This is the collection's default;
# set here so a hard failure is a decision rather than something inherited.
#
# Kept on because clock skew corrupts exactly what this lab measures: Kafka RPC
# requests carry a TTL and expire, flow records land in the wrong buckets, and
# collectors write time-series points in the future. A benchmark that silently
# measures skew is worth less than a deploy that stops.
#
# The check asserts NTPSynchronized rather than requiring an NTP client, so lab
# VMs whose clock is kept by the hypervisor (NTP=no, NTPSynchronized=yes) pass.
# It retries 6 x 10s, which covers a host still converging right after boot.
timesync_required: true

# The db subnet exists precisely so database traffic does not share the
# management path a benchmark also uses. This pointed at the database node's
# *mgmt* address, so the dedicated network was provisioned and idle while
# OpenNMS talked to PostgreSQL over mgmt. Two experiments already used the
# db-subnet address, so the tree disagreed with itself.
#
# Safe to move: postgres_listen_addresses is "*" and postgres_hba_permissions_v4
# covers 192.0.2.0/24, which spans both subnets.
#
# Guarded, and falling back through lab_mgmt_ip to ansible_host. Only the
# spec-driven providers' inventory module emits lab_mgmt_ip; azure, vmware and
# proxmox use terraform/modules/inventory, which does not, so a bare reference
# fails on those providers. Same reasoning as
# kafka_bootstrap_servers below.
opennms_datasource_db_host: >-
  {{ (hostvars[groups['database'][0]].lab_db_ip
      | default(hostvars[groups['database'][0]].lab_mgmt_ip
                 | default(hostvars[groups['database'][0]].ansible_host, true), true))
     if groups.get('database') else '' }}
opennms_datasource_db_port: 5432
opennms_datasource_db_name: onms_benchmark
opennms_datasource_db_user: opennms
opennms_datasource_connection_pool_min_pool: 100
opennms_datasource_connection_pool_max_pool: 100
opennms_datasource_connection_pool_max_size: 100

onns_hzn_base_url: http://192.0.2.200:8980

# Elasticsearch datasource
opennms_es_host: "192.0.2.220"
opennms_es_port: 9200

# Pinned to a Grafana 12.x release so the stock grafana.grafana 6.1.0 collection
# works as-is. Grafana 13 needs a grafana-cli --homepath fix for plugin installs
# that only exists in a non-Galaxy hotfix build (see requirements.yml).
# NOTE: this is the apt package version. Security releases are encoded with a
# "-NN" suffix (Grafana's download pages call them "+security-NN", which matches
# nothing in apt); plain releases carry no suffix. Keep this at the head of the
# 12.x line — a pin below it is a downgrade on hosts that already have a newer
# Grafana, and apt then refuses with "Packages were downgraded and -y was used
# without --allow-downgrades" (see #137).
grafana_version: "12.4.6"
# Datasources are provisioned by bootstrap/roles/grafana via files.
# Empty list overrides the submodule's group_vars (which the collection
# would otherwise use to call its datasource module — rejecting plugin types).
grafana_datasources: []

# ── measured component versions ───────────────────────────────────────────────
#
# The stores and brokers a benchmark measures, pinned here rather than inherited
# from the collection's role defaults.
#
# These were inherited until now, which meant a single indigo423.opennms SHA
# bump could change what the lab measures and read as a routine version bump.
# That is not hypothetical: v0.6.0 → v0.9.0 moved victoriametrics_version from
# 1.148.0 to 1.150.0, and nobody reviewed it, because nothing surfaced it.
# `./compare-role-defaults.sh <ref>` is what surfaces it now.
#
# Every value below is the collection's own default at the pinned SHA, so this
# changes nothing about what a deploy installs. It changes who decides.
#
# Deliberately carrying no `# renovate:` comment, matching opennms_version,
# grafana_version and pg_version above and below. A measured component should
# move when someone chooses to change what is being measured — at a campaign
# boundary — not when an upstream release happens to land mid-run. Staleness
# here is the intended behaviour; compare-role-defaults.sh tells you upstream
# moved without nudging you to follow.
kafka_version: 4.2.0
mimir_version: 3.0.4
victoriametrics_version: 1.150.0

# es_version also drives es_pkg_version ("{{ es_version }}*"), so apt still
# chooses the patch within 8.18.2.
es_version: 8.18.2

es_jvm_options: {}
es_configuration:
  action.destructive_requires_name: true
  bootstrap.memory_lock: true
  # cluster.initial_master_nodes: '["node-1", "node-2"]'
  cluster.max_shards_per_node: 6000
  cluster.name: opennms-flows
  discovery.type: single-node
  # discovery.seed_hosts: '["host1", "host2"]'
  http.port: 9200
  network.host: 0.0.0.0
  node.attr.rack: r1
  node.name: "{{ ansible_hostname }}"
  node.roles: '[master, data, ingest]'
  search.max_buckets: 50000
  path.data: /var/lib/elasticsearch
  path.logs: /var/log/elasticsearch
  xpack.security.enabled: 'false'
  xpack.security.http.ssl.enabled: 'false'
  xpack.security.transport.ssl.enabled: 'false'

pg_version: 18
postgres_user: postgres
postgres_listen_addresses: "*"
postgres_hba_permissions_v4: "192.0.2.0/24"

# Derived from the inventory, not hardcoded. The literal that stood here was
# correct only by coincidence of the kvm allocation rule: kafka sits at index 2
# of local.role_order, so the offset is 4 + 2*4 and cidrhost("192.0.2.64/26", 12)
# lands on .76. Re-space role_order and the literal was silently wrong (#161).
#
# lab_kafka_ip is exported by the spec-driven providers. The fallback is
# lab_mgmt_ip rather than ansible_host: the inventory sets ansible_host to the
# jump host's *public* address on whichever node carries public_ip, so a spec
# giving public_ip to the broker would otherwise hand OpenNMS a public address.
# lab_mgmt_ip is unconditionally the in-lab address, which is what the fallback
# means. Legacy providers lose the subnet separation, which is acceptable
# because only kvm and aws consume deployment specs.
#
# Guarded on the group existing. mimir-single, vm-single and vm-cluster-es
# declare a core and no broker, and the group is simply absent there; an
# unguarded subscript turns a deployment that used to complete into a fatal
# template error. Those specs should really set opennms_message_broker: none,
# since an empty broker address is not a working configuration either — but
# failing the deploy is a regression and rendering nothing is not.
#
# Only the first broker is listed. kafka-cluster-min provisions three, and
# kafka_server_properties builds advertised.listeners from this value, which
# has to be the local broker rather than a list. Splitting the client-facing
# list from the per-host advertised address is a separate change.
kafka_bootstrap_servers: >-
  {{ (hostvars[groups['message_broker'][0]].lab_kafka_ip
      | default(hostvars[groups['message_broker'][0]].lab_mgmt_ip
                 | default(hostvars[groups['message_broker'][0]].ansible_host, true), true)) ~ ':9092'
     if groups.get('message_broker') else '' }}

opennms_properties_webapp:
  opennms.web.base-url: https://%x%c/

opennms_message_broker: kafka

opennms_properties_message_broker:
  org.opennms.activemq.broker.disable: true
  org.opennms.core.ipc.strategy: kafka
  org.opennms.core.ipc.sink.initialSleepTime: 60000
  org.opennms.core.ipc.kafka.bootstrap.servers: "{{ kafka_bootstrap_servers }}"

opennms_minion_controller:
  id: "{{ inventory_hostname }}"
  location: lab-location-01

opennms_minion_kafka:
  "bootstrap.servers": "{{ kafka_bootstrap_servers }}"

kafka_server_properties:
  "process.roles": broker,controller
  "node.id": 1
  "controller.quorum.voters": 1@localhost:9093
  listeners: PLAINTEXT://:9092,CONTROLLER://:9093
  "inter.broker.listener.name": PLAINTEXT
  "advertised.listeners": "PLAINTEXT://{{ kafka_bootstrap_servers }}"
  "controller.listener.names": CONTROLLER
  "listener.security.protocol.map": CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL
  "num.network.threads": 3
  "num.io.threads": 8
  "socket.send.buffer.bytes": 102400
  "socket.receive.buffer.bytes": 102400
  "socket.request.max.bytes": 104857600
  "num.partitions": 1
  "num.recovery.threads.per.data.dir": 1
  "offsets.topic.replication.factor": 1
  "transaction.state.log.replication.factor": 1
  "transaction.state.log.min.isr": 1
  "log.retention.hours": 1
  "log.segment.bytes": 1073741824
  "log.retention.check.interval.ms": 300000
  "log.dirs": /var/log/kafka/combined-logs

# opennms_properties_timeseries:
#   org.opennms.timeseries.strategy: osgi

# Heap follows the machine, not the spec's nominal size. A fixed 8192 was sized
# for an xlarge core (16 GB) and is exactly the whole machine on anything
# smaller, so the JVM cannot commit it and OpenNMS dies at startup with
#   Native memory allocation (mmap) failed to map 8589934592 bytes
# That has now happened twice: on mimir-ha-min, whose core is medium, and on the
# AWS smoke tier, where xlarge maps to an 8 GB instance. Both were the same
# assumption — that a t-shirt size implies a memory size — being true on one
# provider and silently false on another.
#
# 60% of physical memory, capped at the previous 8192 so a 16 GB core renders
# exactly what it did before and existing benchmark numbers stay comparable.
# Integer arithmetic (* 6 // 10) rather than a float multiply: the value is
# quoted straight into a shell config file, where a rounding artefact has no
# business appearing.
opennms_jvm_conf:
  JAVA_HEAP_SIZE: "{{ [ansible_memtotal_mb | int * 6 // 10, 8192] | min }}"
  JAVA_INITIAL_HEAP_SIZE: "{{ [ansible_memtotal_mb | int * 6 // 10, 8192] | min }}"
  # Raw value only — opennms.conf.j2 wraps each opennms_jvm_conf value in shell
  # quotes itself. Pre-quoting here produced ADDITIONAL_MANAGER_OPTIONS=""..."",
  # so `install -dis` passed the literal token "-XX:+UseG1GC to java as a class.
  ADDITIONAL_MANAGER_OPTIONS: "-XX:+UseG1GC -javaagent:/opt/prom-jmx-exporter/jmx_prometheus_javaagent.jar=9299:/opt/prom-jmx-exporter/config.yaml"
