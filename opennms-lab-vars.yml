---
nl6_image: "ghcr.io/labmonkeys-space/nl6:v0.9.0"
nl6_auto_count: 0

opennms_distribution: Horizon
# The OpenNMS apt "stable" dist retains only the current point release —
# superseded versions are removed, so a stale pin fails with
# "no available installation candidate". Keep this in sync with what
# debian.opennms.org actually serves.
opennms_version: "36.0.2"
opennms_pkg_version: "{{ opennms_version }}*"

opennms_datasource_db_host: 192.0.2.196
opennms_datasource_db_port: 5432
opennms_datasource_db_name: onms_benchmark
opennms_datasource_db_user: opennms
opennms_datasource_connection_pool_min_pool: 100
opennms_datasource_connection_pool_max_pool: 100
opennms_datasource_connection_pool_max_size: 100

onns_hzn_base_url: http://192.0.2.200:8980

# Elasticsearch datasource
opennms_es_host: "192.0.2.220"
opennms_es_port: 9200

# Pinned to a Grafana 12.x release so the stock grafana.grafana 6.1.0 collection
# works as-is. Grafana 13 needs a grafana-cli --homepath fix for plugin installs
# that only exists in a non-Galaxy hotfix build (see requirements.yml).
# NOTE: this is the apt package version. Security releases are encoded with a
# "-NN" suffix (Grafana's download pages call them "+security-NN", which matches
# nothing in apt); plain releases carry no suffix. Keep this at the head of the
# 12.x line — a pin below it is a downgrade on hosts that already have a newer
# Grafana, and apt then refuses with "Packages were downgraded and -y was used
# without --allow-downgrades" (see #137).
grafana_version: "12.4.6"
# Datasources are provisioned by bootstrap/roles/grafana via files.
# Empty list overrides the submodule's group_vars (which the collection
# would otherwise use to call its datasource module — rejecting plugin types).
grafana_datasources: []

es_jvm_options: {}
es_configuration:
  action.destructive_requires_name: true
  bootstrap.memory_lock: true
  # cluster.initial_master_nodes: '["node-1", "node-2"]'
  cluster.max_shards_per_node: 6000
  cluster.name: opennms-flows
  discovery.type: single-node
  # discovery.seed_hosts: '["host1", "host2"]'
  http.port: 9200
  network.host: 0.0.0.0
  node.attr.rack: r1
  node.name: "{{ ansible_hostname }}"
  node.roles: '[master, data, ingest]'
  search.max_buckets: 50000
  path.data: /var/lib/elasticsearch
  path.logs: /var/log/elasticsearch
  xpack.security.enabled: 'false'
  xpack.security.http.ssl.enabled: 'false'
  xpack.security.transport.ssl.enabled: 'false'

pg_version: 18
postgres_user: postgres
postgres_listen_addresses: "*"
postgres_hba_permissions_v4: "192.0.2.0/24"

kafka_bootstrap_servers: "192.0.2.76:9092"

opennms_properties_webapp:
  opennms.web.base-url: https://%x%c/

opennms_message_broker: kafka

opennms_properties_message_broker:
  org.opennms.activemq.broker.disable: true
  org.opennms.core.ipc.strategy: kafka
  org.opennms.core.ipc.sink.initialSleepTime: 60000
  org.opennms.core.ipc.kafka.bootstrap.servers: "{{ kafka_bootstrap_servers }}"

opennms_minion_controller:
  id: "{{ inventory_hostname }}"
  location: lab-location-01

opennms_minion_kafka:
  "bootstrap.servers": "{{ kafka_bootstrap_servers }}"

kafka_server_properties:
  "process.roles": broker,controller
  "node.id": 1
  "controller.quorum.voters": 1@localhost:9093
  listeners: PLAINTEXT://:9092,CONTROLLER://:9093
  "inter.broker.listener.name": PLAINTEXT
  "advertised.listeners": "PLAINTEXT://{{ kafka_bootstrap_servers }}"
  "controller.listener.names": CONTROLLER
  "listener.security.protocol.map": CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL
  "num.network.threads": 3
  "num.io.threads": 8
  "socket.send.buffer.bytes": 102400
  "socket.receive.buffer.bytes": 102400
  "socket.request.max.bytes": 104857600
  "num.partitions": 1
  "num.recovery.threads.per.data.dir": 1
  "offsets.topic.replication.factor": 1
  "transaction.state.log.replication.factor": 1
  "transaction.state.log.min.isr": 1
  "log.retention.hours": 1
  "log.segment.bytes": 1073741824
  "log.retention.check.interval.ms": 300000
  "log.dirs": /var/log/kafka/combined-logs

# opennms_properties_timeseries:
#   org.opennms.timeseries.strategy: osgi

# Heap follows the machine, not the spec's nominal size. A fixed 8192 was sized
# for an xlarge core (16 GB) and is exactly the whole machine on anything
# smaller, so the JVM cannot commit it and OpenNMS dies at startup with
#   Native memory allocation (mmap) failed to map 8589934592 bytes
# That has now happened twice: on mimir-ha-min, whose core is medium, and on the
# AWS smoke tier, where xlarge maps to an 8 GB instance. Both were the same
# assumption — that a t-shirt size implies a memory size — being true on one
# provider and silently false on another.
#
# Half of physical memory, capped at the previous 8192 so a 16 GB core renders
# exactly what it did before and existing benchmark numbers stay comparable.
opennms_jvm_conf:
  JAVA_HEAP_SIZE: "{{ [ansible_memtotal_mb | int // 2, 8192] | min }}"
  JAVA_INITIAL_HEAP_SIZE: "{{ [ansible_memtotal_mb | int // 2, 8192] | min }}"
  # Raw value only — opennms.conf.j2 wraps each opennms_jvm_conf value in shell
  # quotes itself. Pre-quoting here produced ADDITIONAL_MANAGER_OPTIONS=""..."",
  # so `install -dis` passed the literal token "-XX:+UseG1GC to java as a class.
  ADDITIONAL_MANAGER_OPTIONS: "-XX:+UseG1GC -javaagent:/opt/prom-jmx-exporter/jmx_prometheus_javaagent.jar=9299:/opt/prom-jmx-exporter/config.yaml"
