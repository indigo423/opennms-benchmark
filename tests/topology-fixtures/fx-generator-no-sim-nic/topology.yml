---
# Expected to FAIL: the generator exists but is not attached to the subnet the
# route needs, so the next hop resolves to an address no interface holds. This
# is #171 exactly, and the first attempt at fixing it reproduced this case.
name: fx-generator-no-sim-nic
description: generator present without a sim NIC
roles:
  loadgen: { count: 1, size: small, subnets: [mgmt], groups: [net_sim] }
  minion: { count: 1, size: small, subnets: [mgmt, sim], routes: { sim: net_sim }, groups: [minion] }
