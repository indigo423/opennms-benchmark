---
- name: Manage PostgreSQL database
  hosts: database
  become: true
  roles:
    - indigo423.opennms.common
    - indigo423.opennms.stub_pgsql

- name: Manage Message broker
  hosts: message_broker
  become: true
  roles:
    - indigo423.opennms.common
    - indigo423.opennms.stub_kafka

- name: Manage Elasticsearch
  hosts: elasticsearch
  become: true
  roles:
    - indigo423.opennms.common
    - indigo423.opennms.stub_elasticsearch

- name: Manage Mimir
  hosts: mimir
  become: true
  roles:
    - indigo423.opennms.common
    - indigo423.opennms.stub_mimir

- name: Manage VictoriaMetrics
  hosts: victoriametrics
  become: true
  roles:
    - indigo423.opennms.common
    - indigo423.opennms.stub_victoriametrics

- name: Manage Grafana
  hosts: grafana
  become: true
  roles:
    - indigo423.opennms.common
    - grafana.grafana.grafana
    - indigo423.opennms.grafana_provisioning

- name: Manage OpenNMS Horizon Core system
  hosts: core
  become: true
  roles:
    - indigo423.opennms.common
    - indigo423.opennms.opennms_core
    # Last, so the unit the drop-in attaches to and restarts already exists.
    - role: opennms_pyroscope_agent
      vars:
        pyroscope_agent_unit: opennms.service
        pyroscope_agent_app_name: opennms-core
        # Each service has its own do-not-start flag in the collection.
        pyroscope_agent_skip_startup: "{{ skip_startup | default('false') }}"

- name: Manage OpenNMS Horizon Minion
  hosts: minion
  become: true
  roles:
    - indigo423.opennms.common
    - indigo423.opennms.opennms_minion
    - role: opennms_pyroscope_agent
      vars:
        pyroscope_agent_unit: minion.service
        pyroscope_agent_app_name: opennms-minion
        pyroscope_agent_skip_startup: "{{ skip_minion_startup | default('false') }}"

- name: Manage OpenNMS Horizon Sentinel
  hosts: sentinel
  become: true
  roles:
    - indigo423.opennms.common
    - indigo423.opennms.opennms_sentinel
