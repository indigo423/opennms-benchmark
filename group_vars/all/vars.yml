---
# Ingestion ports, published rather than collapsed.
#
# The pinned indigo423.opennms collection opens both with the number written
# inline in its firewall tasks, not as a variable:
#
#   roles/opennms_minion/tasks/50-firewall.yml   port: '10514'
#   roles/opennms_minion/tasks/50-firewall.yml   port: '10162'
#   roles/opennms_core/tasks/50-firewall.yml     port: '10162'
#
# A single definition therefore needs a collection change and a pin bump, which
# is a deliberate decision rather than an incidental edit. Until then these are
# constants, published in lab-endpoints.yml and asserted against what the
# collection actually opens by endpoints-playbook.yml.
#
# Changing a value here without changing the collection would open one port and
# listen on another. That failure is silent: traffic is dropped before anything
# logs a rejection, and a benchmark reports a clean zero. The assertion exists
# to make it loud.
lab_syslog_port: 10514
lab_trap_port: 10162

# Kafka Producer topic names. Defined here rather than in the producer role's
# defaults because role defaults are not in scope for the localhost play that
# renders lab-endpoints.yml: the manifest would have had to carry its own copy,
# and a copy the role could diverge from is the fifth definition this whole
# change exists to remove. The role reads these.
lab_kafka_topics:
  metrics: metrics
  events: events
  alarms: alarms
  nodes: nodes

# IPC topics are namespaced by the OpenNMS instance id; producer topics are not.
# Named here so the manifest can publish the sink topic an experiment must read,
# rather than each experiment retyping "OpenNMS.Sink.Trap" and discovering a typo
# as a run where nothing arrived.
lab_instance_id: OpenNMS

# The host-metrics instrument. Pinned here rather than inherited.
#
# bootstrap/preparation-playbook.yml calls prometheus.prometheus.node_exporter,
# and the binary version is a role default inside that collection. So the
# instrument's version was transitively controlled by a collection pin and
# appeared nowhere in this repository: 0.28.0 defaults to node_exporter 1.10.2,
# 0.30.1 to 1.11.1, and the closure bump that moved the collection therefore
# moved the instrument with nothing recording it. A benchmark whose measuring
# device changes version between campaigns, silently, is comparing two things.
#
# 1.11.1 is what the pinned collection ships. Chosen deliberately over holding
# at 1.10.2: no deploy had run since the collection moved, so nothing had
# drifted yet, no stored host-metric series needs to stay comparable, and
# node_exporter 1.11.0 renamed no metric, removed none and changed no
# default collector — it adds the bcachefs and kernel_hung collectors.
#
# WHY THIS FILE AND NOT opennms-lab-vars.yml: deploy.sh runs bootstrap/site.yml
# with no --extra-vars, so a key placed there is never read by a bootstrap role
# — it does not warn, it does not fail, and the role default silently wins.
# That trap is #209, and #197 is the instance where it defeated a version pin
# (the lab ran nl6 v0.9.0 while the root file declared v0.21.0). Pins for roles
# the OpenNMS play invokes belong in opennms-lab-vars.yml; pins for roles a
# bootstrap play invokes belong here.
#
# renovate: datasource=github-releases depName=prometheus/node_exporter
node_exporter_version: "1.11.1"
