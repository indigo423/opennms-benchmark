---
# Ansible Galaxy collections required to deploy the OpenNMS Horizon stack.
# Install with: ansible-galaxy collection install -r requirements.yml

collections:
  # OpenNMS Horizon deployment roles.
  # Source: github.com/opennms-forge/ansible-opennms (published under Galaxy
  # namespace indigo423). Pinned by git SHA for benchmark reproducibility;
  # update only via a deliberate PR, never automatically.
  - name: https://github.com/opennms-forge/ansible-opennms.git
    type: git
    version: 52c6c01e9500f7f3642a53f9b12799bdeee39df7  # v0.9.0

  # Transitive collections used by the OpenNMS deployment roles. Pinned by
  # Galaxy version string (weaker than SHA pinning, matches the prior
  # submodule's regime).
  - name: community.postgresql
    version: "4.2.0"
  # Lags the collection's own CI pin (13.3.0 as of v0.9.0) deliberately, pending
  # the decision in #239. The collection's galaxy metadata only requires
  # >=12.6.0, so this resolves; the cost is that the lab runs a transitive set
  # upstream no longer tests against. Its only usages are ufw, timezone and
  # alternatives, so the blast radius of moving is small when we choose to.
  - name: community.general
    version: "12.6.0"
  # Stock Galaxy release (6.1.0). Works with the Grafana 12.x pin in
  # opennms-lab-vars.yml; the Grafana-13 grafana-cli plugin fix from the
  # non-Galaxy 6.1.1-hotfix.1 build is not needed at that Grafana version.
  - name: grafana.grafana
    version: "6.1.0"

  # Used by the repo-local deployments/roles/rustfs role to create the S3
  # buckets Mimir needs; S3 PutObject fails against a bucket that does not
  # exist and Mimir does not create its own. Not a dependency of the OpenNMS
  # deployment roles.
  - name: amazon.aws
    version: "11.3.0"
