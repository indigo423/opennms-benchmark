[defaults]
roles_path         = bootstrap/roles:deployments/roles:experiments/roles
host_key_checking  = False
pipelining         = True
forks              = 20
interpreter_python = auto_silent
deprecation_warnings = False
# A collection loaded outside its own requires_ansible range is a hard failure,
# not a warning. The default (warning) is how prometheus.prometheus 0.28.0 ran
# for months on ansible-core 2.21.3 — three minors past its declared ceiling —
# with ansible saying so on every play and nobody reading it. A benchmark that
# measures an unsupported combination produces numbers, not results, so failing
# the play is cheaper than trusting the run. `make validate-collections` catches
# the same class in CI before merge; this catches it on the lab.
collections_on_ansible_version_mismatch = error
# Vault password is taken from the ANSIBLE_VAULT_PASSWORD_FILE env var so the
# path stays out of version control. Locally:
#   export ANSIBLE_VAULT_PASSWORD_FILE=~/.config/ansible-opennms/vault-pass

[ssh_connection]
# ControlPersist outlives the longest task, deliberately. Experiments have
# tasks that run for minutes (draining a pipeline, driving a scenario) while a
# delegated host sits untouched; at 60s that host's control master expired and
# the next call found a dead socket, failing the run as "unreachable" halfway
# through a sweep. ServerAlive keeps the jump-host hop from being reaped too.
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
retries = 3
