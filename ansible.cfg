[defaults]
roles_path         = bootstrap/roles:deployments/roles:experiments/roles
host_key_checking  = False
pipelining         = True
forks              = 20
interpreter_python = auto_silent
deprecation_warnings = False
# Vault password is taken from the ANSIBLE_VAULT_PASSWORD_FILE env var so the
# path stays out of version control. Locally:
#   export ANSIBLE_VAULT_PASSWORD_FILE=~/.config/ansible-opennms/vault-pass

[ssh_connection]
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
