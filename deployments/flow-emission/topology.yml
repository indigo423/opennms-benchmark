name: flow-emission
description: >-
  Generator-only topology for measuring what nl6 itself puts on the wire.
  There is no system under test: the question is nl6's own flow emission rate
  and shape, so every component that is not the generator is a component that
  could distort the answer. The collector is a packet capture on the same
  node, which is the least that can observe a datagram.

  The generator also carries an `external` address so its web console is
  reachable from a browser. That is not needed for the capture -- tcpdump runs
  on the node itself -- but interactive checks against a large simulated fleet
  (the topology view, for instance) need a human to be able to load the page.
roles:
  loadgen:
    count: 1
    size: large
    subnets: [mgmt, sim, external]
    public_ip: true
    groups: [net_sim, docker_engine]
