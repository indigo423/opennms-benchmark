---
name: mimir-ha
description: >-
  Deployment A — full HA stack: 3 Elasticsearch, 3 Mimir, 3 Sentinel, 3 Kafka,
  1 PostgreSQL, 1 Core, 2 Minion, nl6 load generator.
roles:
  elasticsearch:
    count: 3
    size: large
    subnets: [mgmt, db]
    groups: [elasticsearch, docker_engine]
  mimir:
    count: 3
    size: large
    subnets: [mgmt, db]
    groups: [mimir, docker_engine]
  database:
    count: 1
    size: small
    subnets: [mgmt, db]
    groups: [database]
  sentinel:
    count: 3
    size: medium
    subnets: [mgmt, db, kafka]
    groups: [sentinel]
  kafka:
    count: 3
    size: medium
    subnets: [mgmt, kafka]
    groups: [message_broker, docker_engine, kafka_ui]
  core:
    count: 1
    size: xlarge
    subnets: [mgmt, db, kafka]
    groups: [core]
  minion:
    count: 2
    size: small
    subnets: [mgmt, kafka, sim]
    routes: { sim: net_sim }
    groups: [minion]
  loadgen:
    count: 1
    size: small
    subnets: [mgmt, sim]
    groups: [net_sim, docker_engine]
  monitoring:
    count: 1
    size: small
    subnets: [mgmt, external]
    public_ip: true
    groups: [mon_servers, docker_engine, grafana]
