---
name: es-nostore
description: >-
  Deployment D — Elasticsearch for flows, no metrics TSDB persistence, 1
  PostgreSQL, 1 Core, 1 Kafka, 1 Minion.
roles:
  elasticsearch:
    count: 1
    size: large
    subnets: [mgmt, db]
    groups: [elasticsearch, docker_engine]
  database:
    count: 1
    size: small
    subnets: [mgmt, db]
    groups: [database]
  core:
    count: 1
    size: xlarge
    subnets: [mgmt, db, kafka]
    groups: [core]
  kafka:
    count: 1
    size: small
    subnets: [mgmt, kafka]
    groups: [message_broker, docker_engine, kafka_ui]
  minion:
    count: 1
    size: small
    subnets: [mgmt, kafka]
    groups: [minion]
  monitoring:
    count: 1
    size: small
    subnets: [mgmt, external]
    public_ip: true
    groups: [mon_servers, docker_engine, grafana]
