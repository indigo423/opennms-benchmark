---
name: kfk-exclusive
description: >-
  Kafka-exclusive metric forwarding. Collectd/SNMP performance-management
  benchmarking with metrics leaving Core only via the Kafka Producer, plus
  Pollerd/Trapd/Syslogd fault-management load. No local time-series store —
  the measurement point is the Kafka metrics topic, not the OpenNMS UI.
  Subnet wiring matches baseline; Elasticsearch is omitted. Renders on
  kvm, aws and proxmox — it declares no `lab` subnet, which is the only
  part of the spec vocabulary proxmox refuses.
roles:
  database:
    count: 1
    size: small
    subnets: [mgmt, db]
    groups: [database]
  core:
    count: 1
    size: xlarge
    # 200, not the 100 in disk-sizes.tfvars: a timed run accumulates RRD/JRB,
    # logs and instrumentation.log for its whole duration, and running Core out
    # of disk mid-run ends the measurement without ending the run.
    disk_gb: 200
    subnets: [mgmt, db, kafka]
    groups: [core]
  kafka:
    # medium, not baseline's small: this broker carries the IPC sink/RPC/twin
    # traffic *and* the entire metric stream, because Kafka is the only
    # persistence target. A saturated broker would make the benchmark measure
    # Kafka rather than OpenNMS. Revert to small only with headroom evidence.
    count: 1
    size: medium
    # 250, not the 50 in disk-sizes.tfvars. Kafka is the only persistence
    # target here, so the broker's disk is sized by run duration rather than by
    # a nominal per-role pin. Measured in #231: ~380 bytes/sample, so 20k
    # samples/s is ~27 GB/hour and the 50 GB pin holds under two hours. When it
    # fills, the broker stops SILENTLY: kafka-metrics-report exits 1 for an
    # unreachable broker exactly as it does for a warning, so a rung tolerates
    # a dead broker as merely degraded and the run yields a plausible-looking
    # partial result. That is #231, which cost a smoke run to diagnose.
    disk_gb: 250
    subnets: [mgmt, kafka]
    groups: [message_broker, docker_engine, kafka_ui]
  minion:
    count: 1
    size: small
    subnets: [mgmt, kafka, sim]
    routes: { sim: net_sim }
    groups: [minion]
  loadgen:
    count: 1
    size: small
    subnets: [mgmt, sim]
    groups: [net_sim, docker_engine]
  monitoring:
    # baseline gives monitoring [mgmt, external]. This profile adds kafka,
    # because the metrics topic is the only measurement point the deployment
    # has and kafka_metrics_report runs here. Without the NIC the consumer
    # resolves the broker's address, routes it out the external gateway and
    # fails with a transport error that reads like a broken broker.
    count: 1
    size: small
    subnets: [mgmt, kafka, external]
    public_ip: true
    groups: [mon_servers, docker_engine, grafana]
