#
# deploy.sh replaces opennms-playbook.yml with this file when
# DEPLOYMENT=kfk-exclusive, so the stock stack is imported rather than
# duplicated — the plays stay in one place and cannot drift.
#
# The Kafka Producer has no variable in the pinned indigo423.opennms
# collection, so enabling it needs the extra play at the bottom. Everything
# else in this deployment is expressed as variables in opennms-lab-vars.yml.

# Runs before anything is installed or configured. The role's own assert would
# otherwise fire only after the imported core play had already applied
# strategy=osgi and restarted OpenNMS, aborting onto a lab with a blocked
# Collectd instead of refusing to build one.
- name: Refuse a half-configured exclusive-forwarding lab
  hosts: core
  gather_facts: false
  tasks:
    - name: Validate the forwarding configuration
      ansible.builtin.import_role:
        name: opennms_kafka_producer
        tasks_from: validate

- name: Deploy the stock OpenNMS stack
  ansible.builtin.import_playbook: ../../opennms-playbook.yml

# Core's first boot happens inside the imported playbook, with strategy=osgi
# already set but the producer feature not yet installed, so Collectd blocks
# until this play's handler restarts it. Transient and self-correcting; it is
# the reason a deploy must not be judged before this play has run.
- name: Enable the Kafka Producer on Core
  hosts: core
  become: true
  roles:
    - opennms_kafka_producer

# Thresholding runs inside Collectd's persistence path and issues
# metadata-scope database calls per evaluation (NMS-19537) — on the smoke lab
# it burned a full thread while the only persistence target was the Kafka
# topic no threshold ever reads. Removed as a controlled variable of this
# deployment: parameter off, definitions deleted, packages deleted.
- name: Remove thresholding from Core
  hosts: core
  become: true
  roles:
    - opennms_thresholding_off

# The deployment publishes syslog and trap ingress in lab-endpoints.yml, so it
# has to bind them. The pinned collection's opennms_minion role configures Kafka
# IPC and the firewall and nothing else, so without this the ports are open, the
# Core-side consumer runs, and nothing listens (#206).
- name: Bind the Minion's fault-management listeners
  hosts: minion
  become: true
  roles:
    - opennms_minion_listeners

# With metrics leaving only via Kafka and EmptyResourceStorageDao in the OSGi
# context, the OpenNMS UI shows no graphs — the topic is the sole measurement
# point a performance-management benchmark has. This installs the consumer that
# reads it.
- name: Install the metrics report consumer on the monitoring node
  hosts: mon_servers
  become: true
  roles:
    - kafka_metrics_report

# The generator's rate lives in nl6's scenario API, not in its systemd unit, so
# driving load at all needs this. It also supplies the delivered half of a
# delivered-vs-accepted reconciliation, which kafka_metrics_report cannot see.
- name: Install the nl6 load-test driver on the monitoring node
  hosts: mon_servers
  become: true
  roles:
    - nl6_loadtest
