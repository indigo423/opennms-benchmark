name: clickhouse-riptide
description: >-
  Riptide flow-capacity benchmark: 1 ClickHouse, 1 riptide
  collector. No OpenNMS components. Both VMs sit directly on the physical
  lab bridge with static addresses so an off-hypervisor nl6 (monkey-head)
  can reach the collector's UDP ingest — required for absolute capacity
  claims (generator off-box). riptide.chaos.engine is pre-reserved DNS for
  .33; the riptide VM routes the simulated-exporter net (10.42.0.0/16) via
  monkey-head so SNMP interface enrichment can reach the nl6 agents.
roles:
  clickhouse:
    count: 1
    size: xlarge
    subnets: [lab]
    addresses: { lab: ["192.168.11.34"] }
    # No docker_engine: the clickhouse role installs native .deb packages.
    groups: [clickhouse]
  riptide:
    count: 1
    size: large
    subnets: [lab]
    addresses: { lab: ["192.168.11.33"] }
    routes: { lab: { to: "10.42.0.0/16", via: "192.168.11.73" } }
    groups: [riptide, docker_engine]
