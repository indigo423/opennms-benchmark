---
# Copyright 2026 Ronny Trommer <ronny@no42.org>
# SPDX-License-Identifier: Apache-2.0

# Values follow pgtune's "Web application" profile, derived from the host's own
# facts rather than written out as constants, because this database gets resized
# during a benchmark campaign and a constant silently stops matching the VM.
# https://pgtune.leopard.in.ua/

postgres_tuning_pg_version: "{{ pg_version | default(18) }}"
postgres_tuning_conf_dir: /etc/postgresql/{{ postgres_tuning_pg_version }}/main/conf.d
postgres_tuning_file: 10-benchmark-tuning.conf

# Must exceed every pool that connects, summed, plus headroom for psql and
# maintenance. OpenNMS Horizon opens three: the main pool, and two smaller ones
# declared in opennms-datasources.xml. See opennms_env in the lab vars.
postgres_tuning_max_connections: 200

# 25% of RAM. On ZFS this is deliberately not raised further: the ARC already
# caches the same blocks, so a larger shared_buffers mostly buys double caching.
postgres_tuning_shared_buffers_mb: "{{ (ansible_memtotal_mb * 0.25) | int }}"

# 75% of RAM. A planner hint about total cache available, not an allocation, so
# it may legitimately overlap the ARC.
postgres_tuning_effective_cache_size_mb: "{{ (ansible_memtotal_mb * 0.75) | int }}"

postgres_tuning_maintenance_work_mem_mb: "{{ [(ansible_memtotal_mb / 16) | int, 2048] | min }}"

# pgtune's web formula: (RAM - shared_buffers) / (max_connections * 3), halved
# again for parallel workers. Per sort/hash node, not per connection, so an
# over-generous value multiplied by max_connections is how a box OOMs.
postgres_tuning_work_mem_kb: >-
  {{ (((ansible_memtotal_mb - (ansible_memtotal_mb * 0.25)) * 1024)
      / (postgres_tuning_max_connections | int * 3) / 2) | int }}

postgres_tuning_max_worker_processes: "{{ ansible_processor_vcpus }}"
postgres_tuning_max_parallel_workers: "{{ ansible_processor_vcpus }}"
postgres_tuning_max_parallel_workers_per_gather: "{{ [(ansible_processor_vcpus / 2) | int, 1] | max }}"
postgres_tuning_max_parallel_maintenance_workers: "{{ [(ansible_processor_vcpus / 2) | int, 1] | max }}"

# SSD/NVMe-backed. random_page_cost near 1.0 tells the planner a random read is
# barely dearer than a sequential one, which is true here and false on spinning
# disk. The lab's zpool is SSD-backed.
postgres_tuning_random_page_cost: "1.1"
postgres_tuning_effective_io_concurrency: 200

postgres_tuning_wal_buffers_mb: 16
postgres_tuning_min_wal_size_gb: 1
postgres_tuning_max_wal_size_gb: 4
postgres_tuning_checkpoint_completion_target: "0.9"
postgres_tuning_default_statistics_target: 100
