- name: Install the Python virtualenv builder
  ansible.builtin.apt:
    name: python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: ["kafka_trap_report"]

- name: Create the tool directory
  ansible.builtin.file:
    path: "{{ kafka_trap_report_home }}"
    state: directory
    owner: "{{ kafka_trap_report_owner }}"
    group: "{{ kafka_trap_report_owner }}"
    mode: "0755"
  tags: ["kafka_trap_report"]

- name: Create the virtualenv
  ansible.builtin.command:
    cmd: python3 -m venv {{ kafka_trap_report_home }}/venv
    creates: "{{ kafka_trap_report_home }}/venv/bin/python"
  tags: ["kafka_trap_report"]

- name: Install the pinned Python dependencies
  ansible.builtin.pip:
    name: "{{ kafka_trap_report_pip }}"
    virtualenv: "{{ kafka_trap_report_home }}/venv"
    state: present
  tags: ["kafka_trap_report"]

- name: Install the trap counter
  ansible.builtin.copy:
    src: kafka_trap_report.py
    dest: "{{ kafka_trap_report_home }}/kafka_trap_report.py"
    owner: "{{ kafka_trap_report_owner }}"
    group: "{{ kafka_trap_report_owner }}"
    mode: "0755"
  tags: ["kafka_trap_report"]

- name: Install the wrapper
  ansible.builtin.copy:
    content: |
      #!/usr/bin/env bash
      # DO NOT EDIT — managed by Ansible (deployments/roles/kafka_trap_report).
      set -euo pipefail
      exec {{ kafka_trap_report_home }}/venv/bin/python \
        {{ kafka_trap_report_home }}/kafka_trap_report.py "$@"
    dest: /usr/local/bin/kafka-trap-report
    owner: "{{ kafka_trap_report_owner }}"
    group: "{{ kafka_trap_report_owner }}"
    mode: "0755"
  tags: ["kafka_trap_report"]
