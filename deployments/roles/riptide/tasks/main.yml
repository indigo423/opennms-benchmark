#
# riptide flow collector as a systemd-managed container (--network host: UDP
# flow ingest must see real exporter source addresses, and host networking
# avoids the conntrack/NAT tax that would distort a capacity benchmark).
# Docker itself comes from the docker_engine group in bootstrap.

- name: Install riptide systemd unit
  ansible.builtin.template:
    src: riptide.service.j2
    dest: /etc/systemd/system/riptide.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart riptide

- name: Enable and start riptide
  ansible.builtin.systemd_service:
    name: riptide
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers so a config change restarts before the readiness gate
  ansible.builtin.meta: flush_handlers

- name: Wait for riptide readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ riptide_mgmt_port }}/readyz"
    status_code: 200
  register: riptide_ready
  retries: 30
  delay: 5
  until: riptide_ready.status == 200
