---
name: mimir-single
description: Deployment G — single Mimir, 1 PostgreSQL, 1 Core.
roles:
  mimir:
    count: 1
    size: large
    subnets: [mgmt, db]
    groups: [mimir, docker_engine]
  database:
    count: 1
    size: small
    subnets: [mgmt, db]
    groups: [database]
  core:
    count: 1
    size: xlarge
    subnets: [mgmt, db, kafka]
    groups: [core]
  monitoring:
    count: 1
    size: small
    subnets: [mgmt, external]
    public_ip: true
    groups: [mon_servers, docker_engine, grafana]
