---
name: vm-single
description: Deployment F — single VictoriaMetrics, 1 PostgreSQL, 1 Core.
roles:
  victoriametrics:
    count: 1
    size: large
    subnets: [mgmt, db]
    groups: [victoriametrics, docker_engine]
  database:
    count: 1
    size: small
    subnets: [mgmt, db]
    groups: [database]
  core:
    count: 1
    size: xlarge
    subnets: [mgmt, db, kafka]
    groups: [core]
  monitoring:
    count: 1
    size: small
    subnets: [mgmt, external]
    public_ip: true
    groups: [mon_servers, docker_engine, grafana]
