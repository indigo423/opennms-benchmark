---
- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ traefik_config_dir }}"
    - "{{ traefik_config_dir }}/certs"
    - "{{ traefik_config_dir }}/dynamic"
  tags: ["traefik"]

- name: Deploy Traefik systemd unit
  ansible.builtin.template:
    src: traefik.service.j2
    dest: /etc/systemd/system/traefik.service
    mode: "0644"
  notify:
    - Restart traefik
  tags: ["traefik"]

- name: Flush handlers before copying config files
  ansible.builtin.meta: flush_handlers
  tags: ["traefik"]

- name: Copy Traefik static config
  ansible.builtin.copy:
    src: traefik/traefik.yml
    dest: "{{ traefik_config_dir }}/traefik.yml"
    mode: "0644"
  notify:
    - Restart traefik
  tags: ["traefik"]

# Templated, not copied: the OpenNMS / Kafka UI / nl6 back ends live on other
# VMs whose addresses are provider-dependent, and most deployments do not run
# all three roles. See the template header.
- name: Deploy Traefik dynamic routes
  ansible.builtin.template:
    src: traefik/dynamic/routes.yml.j2
    dest: "{{ traefik_config_dir }}/dynamic/routes.yml"
    mode: "0644"
  notify:
    - Restart traefik
  tags: ["traefik"]

- name: Generate self-signed TLS certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -newkey rsa:4096
        -keyout {{ traefik_config_dir }}/certs/lab.key
        -out {{ traefik_config_dir }}/certs/lab.crt
        -days 3650 -nodes
        -subj "/CN=monitoring/O=Lab"
    creates: "{{ traefik_config_dir }}/certs/lab.crt"
  tags: ["traefik"]

- name: Restrict cert key permissions
  ansible.builtin.file:
    path: "{{ traefik_config_dir }}/certs/lab.key"
    mode: "0600"
  tags: ["traefik"]

- name: Enable Traefik as a service
  ansible.builtin.service:
    name: traefik.service
    state: started
    enabled: true
  tags: ["traefik"]

# systemd reports a unit started as soon as docker run is accepted, and
# Restart=always turns a rejected argument or an unusable config into a restart
# loop rather than a failure, so `state: started` alone reports a green deploy
# over a dead service. That is how jaeger ran in a crash loop for days (#295).
# Ask the service instead.
#
# The role generates a self-signed certificate, so validation is off
- name: Wait for Traefik to answer
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ traefik_https_port }}/"
    method: GET
    status_code: [200]
    validate_certs: false
  register: traefik_ready
  until: traefik_ready.status | default(0) in [200]
  retries: 12
  delay: 5
  changed_when: false
  tags: ["traefik"]

- name: Report the Traefik image that answered
  ansible.builtin.debug:
    msg: "Traefik answered from {{ traefik_image }}"
  tags: ["traefik"]
