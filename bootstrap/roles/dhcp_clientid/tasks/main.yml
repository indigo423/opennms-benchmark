---
- name: Pin DHCP client identifier for interface {{ dhcp_clientid_interface }}
  ansible.builtin.copy:
    dest: "{{ dhcp_clientid_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      network:
        version: 2
        ethernets:
          {{ dhcp_clientid_interface }}:
            dhcp-identifier: {{ dhcp_clientid_mode }}
  notify:
    - Apply netplan
  tags: ["dhcp-clientid", "network"]
