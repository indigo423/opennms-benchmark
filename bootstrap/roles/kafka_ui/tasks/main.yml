---
- name: Deploy kafka-ui systemd unit
  ansible.builtin.template:
    src: kafka-ui.service.j2
    dest: /etc/systemd/system/kafka-ui.service
    mode: "0644"
  notify:
    - Restart kafka-ui
  tags: ["monitoring", "kafka-ui"]

- name: Flush handlers before enabling service
  ansible.builtin.meta: flush_handlers
  tags: ["monitoring", "kafka-ui"]

- name: Enable Kafka UI as a service
  ansible.builtin.service:
    name: kafka-ui.service
    state: started
    enabled: true
  tags: ["monitoring", "kafka-ui"]

# systemd reports a unit started as soon as docker run is accepted, and
# Restart=always turns a rejected argument or an unusable config into a restart
# loop rather than a failure, so `state: started` alone reports a green deploy
# over a dead service. That is how jaeger ran in a crash loop for days (#295).
# Ask the service instead.
#
# Runs in its own play on the broker host
#
# The probe must go through the context path. The unit sets
# SERVER_SERVLET_CONTEXT_PATH, so the application is mounted under it and a bare
# `/` is a 404 from a perfectly healthy service — the same trap the Prometheus
# role documents for its route prefix. Asking `/` failed every deploy from #296,
# which added this readiness check, until it was found in #316: 24 retries, then
# a fatal, on a Kafka UI that was up and scraping the cluster.
#
# actuator/health rather than the SPA root, so a 200 means the application
# reports itself healthy rather than merely that something served an index page.
- name: Wait for Kafka UI to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ kafka_ui_port }}{{ kafka_ui_context_path | regex_replace('/$', '') }}/actuator/health"
    method: GET
    status_code: [200]
  register: kafka_ui_ready
  until: kafka_ui_ready.status | default(0) in [200]
  retries: 24
  delay: 5
  changed_when: false
  tags: ["monitoring", "kafka-ui"]

- name: Report the Kafka UI image that answered
  ansible.builtin.debug:
    msg: "Kafka UI answered from {{ kafka_ui_image }}"
  tags: ["monitoring", "kafka-ui"]
