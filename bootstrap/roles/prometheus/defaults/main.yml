---
# Pinned to the version the lab is running and every stored benchmark series
# was produced against, which is also the current upstream release (2026-08-18).
# It was ':latest' until #289, where jaeger showed what a moving tag costs: a
# registry change broke a service with no change in this repository, and the
# breakage was undiagnosable afterwards because nothing recorded what had run.
#
# This is the instrument, not the system under test, but a benchmark whose
# instrument changes version mid-campaign is comparing two things. Move it
# deliberately, at a campaign boundary, like the other measured components.
prometheus_image: quay.io/prometheus/prometheus:v3.14.0
prometheus_port: "9090"
prometheus_cpus: "2.0"
prometheus_memory: 512m
prometheus_tz: UTC
prometheus_config_dir: /etc/docker/prometheus
prometheus_retention_time: 90d

# Extra VictoriaMetrics instances to scrape, as "host:port".
#
# Normally empty and normally should stay that way. The template already derives
# the job from two places that each own the address: members of the
# victoriametrics inventory group, and the backend named by
# opennms_remotewrite.write_url. Both follow the deployment, so neither can
# disagree with it.
#
# This list is for the case neither covers: a store on a different lab that this
# deployment does not write to yet, which therefore has no route into the
# scrape config at all. That is the state the vm-target backend was in before
# #316 enabled remote_write against it. Anything added here is a second place an
# address is written down, so remove the entry once the deployment writes to it
# and the target derives itself.
prometheus_victoriametrics_targets: []
