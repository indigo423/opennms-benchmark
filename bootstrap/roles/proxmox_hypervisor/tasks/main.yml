---
# Tag policy: everything that establishes a fact other tasks consume, and every
# safety assert, is tagged `always`. meta/main.yml documents `--tags proxmox-nat`
# as a supported invocation, and a sub-tag run that skipped these would render
# ce-lab-nat.service.j2 with proxmox_uplink_bridge undefined, or call
# `pvesh get /nodes//network` with an empty node name. `always` rather than
# repeating every sub-tag, so adding a sub-tag later cannot silently reintroduce
# the same hole.
- name: Confirm this host is a Proxmox VE node
  ansible.builtin.command: pveversion
  register: proxmox_pveversion
  changed_when: false
  failed_when: proxmox_pveversion.rc != 0
  tags: ["always"]

- name: Resolve the node name
  ansible.builtin.command: hostname
  register: proxmox_node_name_cmd
  changed_when: false
  tags: ["always"]

# Asserted before the fact below dereferences it. Without this, a host with no
# default route dies on an undefined-attribute error rather than the guard's
# own message -- and the same fact is interpolated into the NAT unit's `-o`
# flag, where an empty value renders a broken iptables rule.
- name: Require a default route, since the uplink is derived from it
  ansible.builtin.assert:
    that:
      - ansible_default_ipv4 is defined
      - ansible_default_ipv4.interface is defined
      - ansible_default_ipv4.interface | length > 0
    fail_msg: >-
      No IPv4 default route on this host, so the uplink interface cannot be
      identified. This role derives the interface it must never touch, and the
      NAT unit's outbound interface, from the default route.
    quiet: true
  tags: ["always"]

- name: Record node name and uplink bridge
  ansible.builtin.set_fact:
    proxmox_node_name: "{{ proxmox_node_name_cmd.stdout | trim }}"
    # The interface holding the default route is the hypervisor's own uplink.
    # Everything below refuses to touch it.
    proxmox_uplink_bridge: "{{ ansible_default_ipv4.interface }}"
  tags: ["always"]

# The failure this guard prevents is losing the hypervisor. The README's bridge
# table assigns bridge_mgmt = vmbr0, which on any single-uplink host is the
# interface Ansible is connected over.
- name: Refuse to claim the hypervisor's own uplink bridge for a lab subnet
  ansible.builtin.assert:
    that:
      - proxmox_uplink_bridge not in proxmox_lab_bridges
      - proxmox_mgmt_bridge != proxmox_uplink_bridge
    fail_msg: >-
      {{ proxmox_uplink_bridge }} carries this hypervisor's default route
      ({{ ansible_default_ipv4.address }}). Claiming it for a lab subnet would
      cut off the host. Assign it to bridge_ext in proxmox.tfvars and give the
      lab subnets their own bridges.
    success_msg: "Uplink {{ proxmox_uplink_bridge }} is not claimed by any lab bridge"
  tags: ["always"]

- name: Require the management bridge to be one of the lab bridges
  ansible.builtin.assert:
    that: proxmox_mgmt_bridge in proxmox_lab_bridges
    fail_msg: >-
      proxmox_mgmt_bridge ({{ proxmox_mgmt_bridge }}) is not in
      proxmox_lab_bridges, so it would never be created.
  tags: ["always"]

# ── snippets datastore ───────────────────────────────────────────────────────

- name: Read the snippets datastore configuration
  ansible.builtin.command: >-
    pvesh get /storage/{{ proxmox_snippets_datastore }} --output-format json
  register: proxmox_snippets_ds_raw
  changed_when: false
  tags: ["proxmox-hypervisor", "proxmox-snippets"]

- name: Parse the snippets datastore configuration
  ansible.builtin.set_fact:
    proxmox_snippets_ds: "{{ proxmox_snippets_ds_raw.stdout | from_json }}"
  tags: ["proxmox-hypervisor", "proxmox-snippets"]

- name: Require a file-based snippets datastore
  ansible.builtin.assert:
    that: proxmox_snippets_ds.type not in proxmox_block_datastore_types
    fail_msg: >-
      Datastore "{{ proxmox_snippets_datastore }}" is type
      {{ proxmox_snippets_ds.type }}, which cannot hold snippets. Snippets are
      plain files, so point proxmox_snippets_datastore at a file-based datastore
      such as a dir store.
    success_msg: >-
      Datastore "{{ proxmox_snippets_datastore }}" is type
      {{ proxmox_snippets_ds.type }} and can hold snippets
  tags: ["proxmox-hypervisor", "proxmox-snippets"]

# Appends rather than replaces: overwriting content would strip iso, vztmpl and
# backup off the store the node uses for everything else.
- name: Enable the snippets content type
  ansible.builtin.command: >-
    pvesm set {{ proxmox_snippets_datastore }}
    --content {{ (proxmox_snippets_ds.content | split(',') | map('trim') | list + ['snippets']) | unique | join(',') }}
  changed_when: true
  when: "'snippets' not in (proxmox_snippets_ds.content | split(',') | map('trim') | list)"
  tags: ["proxmox-hypervisor", "proxmox-snippets"]

# ── lab bridges ──────────────────────────────────────────────────────────────

- name: Read the node's current network configuration
  ansible.builtin.command: >-
    pvesh get /nodes/{{ proxmox_node_name }}/network --output-format json
  register: proxmox_network_raw
  changed_when: false
  tags: ["proxmox-hypervisor", "proxmox-bridges"]

- name: Record which bridges already exist
  ansible.builtin.set_fact:
    proxmox_existing_ifaces: >-
      {{ proxmox_network_raw.stdout | from_json | map(attribute='iface') | list }}
  tags: ["proxmox-hypervisor", "proxmox-bridges"]

# Created through the PVE API rather than by writing /etc/network/interfaces.d,
# so the bridges appear in the Proxmox UI and are validated on the way in.
# No bridge_ports: an uplink-less bridge keeps 192.0.2.0/24, which is
# documentation address space, off the real network.
- name: Create the lab bridges
  ansible.builtin.command: >-
    pvesh create /nodes/{{ proxmox_node_name }}/network
    --iface {{ item }}
    --type bridge
    --autostart 1
    {% if item == proxmox_mgmt_bridge %}
    --cidr {{ proxmox_mgmt_gateway_cidr }}
    --comments "OpenNMS benchmark lab management subnet; hypervisor is the gateway"
    {% else %}
    --comments "OpenNMS benchmark lab; no uplink"
    {% endif %}
  loop: "{{ proxmox_lab_bridges }}"
  changed_when: true
  when: item not in proxmox_existing_ifaces
  notify: Apply Proxmox network configuration
  tags: ["proxmox-hypervisor", "proxmox-bridges"]

# Separate from creation so a bridge that pre-exists without an address still
# gets one, and so a re-run of the role converges rather than skipping.
- name: Ensure the management bridge holds the lab gateway address
  ansible.builtin.command: >-
    pvesh set /nodes/{{ proxmox_node_name }}/network/{{ proxmox_mgmt_bridge }}
    --type bridge
    --cidr {{ proxmox_mgmt_gateway_cidr }}
  changed_when: true
  when: >-
    proxmox_mgmt_bridge in proxmox_existing_ifaces
    and (proxmox_network_raw.stdout | from_json
         | selectattr('iface', 'equalto', proxmox_mgmt_bridge)
         | map(attribute='cidr') | first | default('')) != proxmox_mgmt_gateway_cidr
  notify: Apply Proxmox network configuration
  tags: ["proxmox-hypervisor", "proxmox-bridges"]

# Answers "did this run stage anything?", which is what separates our pending
# changes from someone else's. Both tasks above are skipped on a converged host,
# and a skipped task reports changed=false.
# What the staged file CONTAINS, not who staged it.
#
# The apply is keyed on /etc/network/interfaces.new existing rather than on this
# run's own changes, because that is what lets an interrupted run converge. The
# cost is that an unrelated pending edit -- staged in the UI for a maintenance
# window, say -- would be pushed live too, on the interface Ansible is connected
# over.
#
# "Did this run stage anything?" is the wrong discriminator for that, in both
# directions. A run that both creates a missing bridge AND finds a foreign edit
# already staged would pass it and apply the foreign edit. A run resuming after
# an interrupted one stages nothing, because `pvesh get` reports the staged
# bridges as existing so the create tasks skip -- and would then be refused,
# defeating the convergence the file-keyed apply exists to provide.
#
# So inspect the diff instead: if every interface it touches is one of ours, the
# staged content is ours whoever wrote it, and applying it is safe.
- name: Check for staged but unapplied network changes
  ansible.builtin.stat:
    path: /etc/network/interfaces.new
  register: proxmox_network_pending
  changed_when: proxmox_network_pending.stat.exists
  notify: Apply Proxmox network configuration
  tags: ["always"]

# Each line is attributed to the stanza it belongs to before diffing, rather
# than the diff output being grepped for interface names. Grepping only sees a
# name on an `auto`/`iface` line, so a staged change to an *existing*
# interface -- `address 192.168.10.99/24` under vmbr0, say -- produced a diff
# line naming nothing, was dropped, and the guard reported that only lab
# bridges were touched. It would then have applied an edit to the uplink
# Ansible is connected over, which is the one thing it exists to refuse.
#
# Blank lines and comments are skipped, or a trailing blank before a newly
# appended stanza attaches to the preceding one and reports it as touched.
- name: Determine which interfaces the staged configuration touches
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      stanzas() {
      awk 'NF==0 || /^[[:space:]]*#/ {next}
           /^[[:space:]]*(auto|allow-[^ ]+)[[:space:]]+/ {name=$2}
           /^[[:space:]]*iface[[:space:]]+/ {name=$2}
           {print name"\t"$0}' "$1";
      };
      diff <(stanzas /etc/network/interfaces) <(stanzas /etc/network/interfaces.new)
      | grep -E '^[<>]'
      | awk '{print $2}' | sort -u
    executable: /bin/bash
  register: proxmox_staged_ifaces
  changed_when: false
  # diff exits 1 when the files differ, which is the expected case here.
  failed_when: proxmox_staged_ifaces.rc > 1
  when: proxmox_network_pending.stat.exists
  tags: ["always"]

- name: Refuse to apply staged network changes that touch anything but the lab bridges
  ansible.builtin.assert:
    that:
      - proxmox_foreign_staged_ifaces | length == 0
        or proxmox_apply_foreign_network | bool
    fail_msg: >-
      /etc/network/interfaces.new has staged changes touching
      {{ proxmox_foreign_staged_ifaces | join(', ') }}, which are not lab
      bridges. Applying it would push an edit this role did not write -- on the
      uplink, in the worst case. Review it with
      `diff /etc/network/interfaces /etc/network/interfaces.new`, then either
      apply it yourself or re-run with -e proxmox_apply_foreign_network=true.
    success_msg: >-
      {{ proxmox_network_pending.stat.exists
         | ternary('Staged changes touch only lab bridges; safe to apply',
                   'No staged network changes') }}
    quiet: true
  vars:
    proxmox_foreign_staged_ifaces: >-
      {{ (proxmox_staged_ifaces.stdout_lines | default([]))
         | reject('in', proxmox_lab_bridges) | list }}
  # Pointless when nothing will be applied: with proxmox_apply_network false the
  # handler is skipped, so a pre-existing foreign edit is left exactly as found.
  # Refusing anyway would make the documented "stage without applying" escape
  # hatch unusable on any host with a pending edit.
  when: proxmox_apply_network | bool
  tags: ["always"]

# Handlers normally run at the end of the play, but dnsmasq below binds to an
# address that only exists once the network has been applied. Flush here so the
# bridges are actually up before anything depends on them.
- name: Apply pending network changes before binding services to them
  ansible.builtin.meta: flush_handlers

# Everything below binds to, or routes for, addresses that exist only once the
# network has been applied. With `-e proxmox_apply_network=false` the handler
# above is skipped and the bridges live only in interfaces.new, so dnsmasq --
# configured with `interface=vmbr1`, a listen-address on it, and
# bind-interfaces -- exits fatally on an unknown interface and fails the play.
# The documented "stage without applying" flag has to mean the services wait
# too, not just the bridges.
- name: Establish whether services may bind to lab-network addresses
  ansible.builtin.set_fact:
    proxmox_network_live: "{{ proxmox_apply_network | bool }}"
  tags: ["always"]

- name: Report that routing and DNS are deferred with the staged network
  ansible.builtin.debug:
    msg: >-
      proxmox_apply_network is false, so the lab bridges remain staged in
      /etc/network/interfaces.new. NAT and DNS are skipped: they bind to
      addresses that do not exist yet. Re-run without the flag to apply.
  when: not proxmox_network_live
  tags: ["proxmox-hypervisor", "proxmox-bridges", "proxmox-nat", "proxmox-dns"]

# ── routing ──────────────────────────────────────────────────────────────────

# IPv4 forwarding comes from the ip_forwarding role via meta/main.yml. Without
# it, and without the masquerade below, lab VMs have a default route to an
# address that answers but does not forward. cloud-init then cannot install
# qemu-guest-agent, and terraform blocks waiting for the agent and times out:
# a provider timeout that says nothing about routing.
- name: Install the lab NAT unit
  ansible.builtin.template:
    src: ce-lab-nat.service.j2
    dest: /etc/systemd/system/ce-lab-nat.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart lab NAT
  when: proxmox_network_live
  tags: ["proxmox-hypervisor", "proxmox-nat"]

- name: Enable the lab NAT unit
  ansible.builtin.systemd_service:
    name: ce-lab-nat.service
    enabled: true
    state: started
    daemon_reload: true
  when: proxmox_network_live
  tags: ["proxmox-hypervisor", "proxmox-nat"]

# ── DNS ──────────────────────────────────────────────────────────────────────

# Required, not optional. modules/cloud-init defaults an interface's nameservers
# to its gateway:
#
#   nameservers:
#     addresses: [${join(", ", coalesce(iface.nameservers, [iface.gateway]))}]
#
# and no provider overrides it. So every lab VM is told its resolver is the
# management gateway. On KVM that works because libvirt runs dnsmasq on its NAT
# gateway; on Proxmox nothing listens there, so masquerading alone gives IP
# connectivity and no name resolution, and cloud-init's apt still fails. This
# task is what makes Proxmox match what KVM gets for free.
# Non-fatal on purpose. A stock PVE install enables enterprise.proxmox.com,
# which returns 401 without a subscription, so a full apt cache refresh can
# never succeed on an unsubscribed node — which is most lab hosts. dnsmasq comes
# from the Debian repositories, which do work, so failing the play on the
# enterprise 401 would make this role unusable on exactly the hosts it targets.
- name: Refresh the apt cache, tolerating unauthenticated PVE enterprise repos
  ansible.builtin.apt:
    update_cache: true
  failed_when: false
  changed_when: false
  when: proxmox_manage_dns | bool and proxmox_network_live
  tags: ["proxmox-hypervisor", "proxmox-dns"]

- name: Install dnsmasq for lab name resolution
  ansible.builtin.apt:
    name: dnsmasq
    state: present
  when: proxmox_manage_dns | bool and proxmox_network_live
  tags: ["proxmox-hypervisor", "proxmox-dns"]

# Resolver only. Lab VMs are statically addressed by cloud-init, so DHCP is
# explicitly off: a stray DHCP server on a lab bridge would be worse than none.
- name: Configure dnsmasq for the lab management subnet
  ansible.builtin.template:
    src: ce-lab-dns.conf.j2
    dest: /etc/dnsmasq.d/ce-lab-dns.conf
    owner: root
    group: root
    mode: "0644"
  when: proxmox_manage_dns | bool and proxmox_network_live
  notify: Restart dnsmasq
  tags: ["proxmox-hypervisor", "proxmox-dns"]

# Installing dnsmasq starts Debian's stock configuration, which binds 0.0.0.0:53
# on every interface -- including the hypervisor's uplink. The config above is
# what restricts it, and handlers otherwise run at the end of the play, so any
# failure in between would leave an open resolver on the site LAN. Flush here to
# close that window, for the same reason the network is flushed above.
- name: Restrict dnsmasq before anything else can fail
  ansible.builtin.meta: flush_handlers

- name: Enable dnsmasq
  ansible.builtin.systemd_service:
    name: dnsmasq
    enabled: true
    state: started
  when: proxmox_manage_dns | bool and proxmox_network_live
  tags: ["proxmox-hypervisor", "proxmox-dns"]

- name: Report the prepared state
  ansible.builtin.debug:
    msg:
      - "node: {{ proxmox_node_name }} ({{ proxmox_pveversion.stdout | trim }})"
      - "uplink (untouched): {{ proxmox_uplink_bridge }} {{ ansible_default_ipv4.address }}"
      - "lab bridges: {{ proxmox_lab_bridges | join(', ') }}"
      - "mgmt gateway: {{ proxmox_mgmt_gateway_cidr }} on {{ proxmox_mgmt_bridge }}"
      - "masquerading {{ proxmox_mgmt_subnet }} out {{ proxmox_uplink_bridge }}"
      - "resolver: {{ proxmox_manage_dns | bool | ternary(proxmox_mgmt_gateway_address + ' (dnsmasq)', 'not managed') }}"
      - "snippets datastore: {{ proxmox_snippets_datastore }} ({{ proxmox_snippets_ds.type }})"
  tags: ["proxmox-hypervisor"]
