---
# # file: opennms-playbook.yml

- name: Wait for system readiness
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to complete
      become: true
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: result.rc not in [0, 2]
      register: result
      timeout: 120

- name: Basic configuration and tooling
  hosts: all
  become: true
  roles:
    - etc_hosts
    - apt_update
    - common
    - prometheus.prometheus.node_exporter

- name: Docker Engine
  hosts: docker_engine
  become: true
  roles:
    - docker_ce

- name: Monitoring services
  hosts: mon_servers
  become: true
  # Jaeger was removed in #289. A deleted role cannot stop the unit it left
  # behind, and that unit restarts every five seconds forever, so the removal
  # has to reach the host once. Same shape as the legacy-unit cleanup the nl6
  # role carries. Delete this block once every lab has run it.
  pre_tasks:
    - name: Stop and disable the removed jaeger service
      ansible.builtin.systemd:
        name: jaeger.service
        state: stopped
        enabled: false
      failed_when: false
      tags: ["monitoring", "jaeger-cleanup"]

    - name: Remove the jaeger unit, config and container
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/jaeger.service
        - /etc/jaeger
      notify: Reload systemd after removing jaeger
      tags: ["monitoring", "jaeger-cleanup"]

    # docker rm -f exits 0 whether or not the container was there, so asking
    # first is what keeps this idempotent. Same shape as the legacy-container
    # check in the nl6 role.
    - name: Check whether the jaeger container still exists
      ansible.builtin.command:
        cmd: docker inspect jaeger
      register: jaeger_inspect
      changed_when: false
      failed_when: false
      tags: ["monitoring", "jaeger-cleanup"]

    - name: Remove the jaeger container
      ansible.builtin.command:
        cmd: docker rm -f jaeger
      when: jaeger_inspect.rc == 0
      changed_when: true
      tags: ["monitoring", "jaeger-cleanup"]

  handlers:
    - name: Reload systemd after removing jaeger
      ansible.builtin.systemd:
        daemon_reload: true

  roles:
    - ip_forwarding
    - grafana
    - pgadmin
    - app_starter
    - kibana
    - prometheus
    - pyroscope
    - traefik

- name: Net-Simulator
  hosts: net_sim
  become: true
  roles:
    - role: rp_filter
      vars:
        rp_filter_interfaces:
          - all
          - default
          - "{{ nl6_net_interface }}"
    - net_snmp
    - nl6

- name: Minion
  hosts: minion
  become: true
  roles:
    - rp_filter

- name: Kafka-UI
  hosts: kafka_ui
  become: true
  roles:
    - kafka_ui
