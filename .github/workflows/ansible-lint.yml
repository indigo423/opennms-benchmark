---
name: Ansible Lint

# No `paths:` filters: they let a PR touching only unlisted files merge with no
# checks at all, and a filtered-out workflow reports nothing — which would leave
# a required status check pending forever once main is protected. The job is
# cheap enough that linting everything beats reasoning about the filter list.
on:
  pull_request:
  push:
    branches:
      - main

# The repo-level default workflow token is read-only today; declaring it here
# keeps that true even if the setting drifts. Nothing in this workflow writes.
permissions:
  contents: read

# A superseded lint run tells us nothing — cancel it and keep the queue short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI invokes the `make lint-ansible` target, never ansible-lint directly, so local
# and CI stay in sync.
jobs:
  lint:
    name: Lint
    # Pinned rather than ubuntu-latest so GitHub's image migrations don't move
    # under the build on their own schedule.
    runs-on: ubuntu-24.04
    # Collection installs dominate the runtime; 15m is generous headroom, and a
    # real hang now fails in minutes instead of burning the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Install ansible-lint first: it pulls a known ansible-core into this
      # (setup-python-pinned) interpreter, and the ansible-galaxy used below
      # then comes from that same core — so lint resolves collections against
      # the core they were installed with. Pinned to match the previously used
      # ansible/ansible-lint@v26.6.0 action.
      # -c constraints.txt pins ansible-core. Without it CI runs whatever core
      # ansible-lint happens to resolve, which is the layer that broke twice:
      # once on a floor (core 2.20 rejecting a collection's string `when`) and
      # once on a ceiling (a collection running three minors past its declared
      # requires_ansible). Verified that 26.6.0 resolves cleanly under the pin.
      - name: Install ansible-lint
        run: python3 -m pip install -c constraints.txt ansible-lint==26.6.0

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      # One install, resolver off. This replaced two sequential installs whose
      # order silently decided which community.general won, and which left
      # community.library_inventory_filtering_v1 behind as an orphan every run.
      - name: Install the collection closure
        run: make install-collections

      # Runs before ansible-lint because a closure that does not resolve makes a
      # lint result meaningless — lint would pass against whatever happened to be
      # installed. This is also the only check that sees requires_ansible, which
      # is two-sided: a collection can be too old *or* too new for the core in
      # use, and nothing else in the pipeline looks at either end.
      - name: Validate the collection closure
        run: make validate-collections

      # No ANSIBLE_ROLES_PATH here: the env var overrides ansible.cfg's
      # roles_path, so duplicating it in CI let the two drift apart — CI kept
      # resolving only bootstrap/roles after deployments/roles was added, and
      # failed on a role that resolves fine locally. ansible.cfg is the single
      # source of truth; `make lint-ansible` runs from the repo root and picks
      # it up.

      # ansible-lint parses vault-encrypted group_vars but never decrypts them;
      # a throwaway password file lets them load without a real secret in CI.
      - name: Provide dummy vault password
        run: |
          mkdir -p ~/.config/ansible-opennms
          echo dummy > ~/.config/ansible-opennms/vault-pass
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$HOME/.config/ansible-opennms/vault-pass" >> "$GITHUB_ENV"

      - name: Run ansible-lint
        run: make lint-ansible
