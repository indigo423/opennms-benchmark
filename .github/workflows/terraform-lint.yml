---
name: Terraform Lint

# No `paths:` filters — see the note in ansible-lint.yml: a filtered-out workflow
# reports nothing, which leaves a required status check pending forever.
on:
  pull_request:
  push:
    branches:
      - main

# The repo-level default workflow token is read-only today; declaring it here
# keeps that true even if the setting drifts. Nothing in this workflow writes.
permissions:
  contents: read

# A superseded lint run tells us nothing — cancel it and keep the queue short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI invokes Makefile targets, never terraform directly, so local and CI stay in sync.
# Every job pins runs-on to a concrete image rather than ubuntu-latest, so
# GitHub's image migrations don't move under the build on their own schedule.
jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      - name: make fmt
        run: make fmt

  validate-azure:
    name: Validate (Azure)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      - name: make validate-azure
        run: make validate-azure

  validate-aws:
    name: Validate (AWS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      # No AWS credentials are needed or configured: validate checks syntax and
      # types only, and never contacts the provider API.
      - name: make validate-aws
        run: make validate-aws

  validate-kvm:
    name: Validate (KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      # The Makefile passes -upgrade on kvm init so the community dmacvicar/libvirt
      # provider downloads; validate then checks syntax/types only (no host needed).
      - name: make validate-kvm
        run: make validate-kvm

  validate-proxmox:
    name: Validate (Proxmox)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      - name: make validate-proxmox
        run: make validate-proxmox

  validate-vmware:
    name: Validate (VMware)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      - name: make validate-vmware
        run: make validate-vmware

  # Terraform roots that are not providers, so they have no validate-<provider>
  # job above. `make fmt` and `make tflint` already reach them recursively; only
  # `terraform validate` needs telling, because it resolves one root per -chdir.
  validate-extra-roots:
    name: Validate (non-provider roots)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      - name: make validate-extra-roots
        run: make validate-extra-roots

  # `terraform validate` above checks types and syntax. It does not evaluate
  # locals against real values, and resource preconditions are plan-time only, so
  # a deployment spec whose route points at a node that does not exist passes
  # every other gate here -- which is how a hardcoded next hop stayed wrong until
  # it was found by hand (#171). This renders every spec with `terraform console`
  # and asserts the result.
  #
  # It renders through every spec-driven provider, not just kvm, so aws's and
  # proxmox's copies of the invariants are asserted too. Timeout is generous
  # because that is 3 providers x 15 specs plus fixtures, each a separate
  # `terraform console` invocation.
  #
  # No credentials and no hypervisor: console evaluates the provider's own locals
  # without contacting one, and the script passes placeholder values for every
  # variable rather than reading a gitignored <provider>.tfvars. It initialises
  # each root on demand, so this job runs the make target directly like every
  # other. Each render is bounded, so a hang reports a named per-spec timeout
  # instead of sitting until the job limit.
  validate-topology:
    name: Deployment Topologies
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # terraform_wrapper: false is load-bearing here and nowhere else in this
      # workflow. The action installs a Node wrapper around the terraform binary
      # to capture stdout/stderr for step outputs, and that wrapper does not
      # forward stdin. This is the only job that pipes into terraform:
      # `printf "$EXPR" | terraform console`. With the wrapper, console gets no
      # input and waits for it, so every render produced no output and was killed
      # at the per-spec timeout -- which is why this check has never passed in CI
      # while passing in 22s on a laptop, on this branch and on #264 alike.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"
          terraform_wrapper: false

      - name: make validate-topology
        run: make validate-topology

  tflint:
    name: TFLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6.3.0
        with:
          tflint_version: latest

      - name: make tflint
        run: make tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
